<!-- templates/emails/inquiry_reply.html -->
{% extends "emails/base.html" %}

{% block content %}
<table width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td style="padding: 30px 0; font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333333;">

            <!-- Subject line -->
            <h2 style="color: #1a1a1a; margin: 0 0 20px 0; font-size: 22px; border-bottom: 2px solid #007bff; padding-bottom: 10px;">
                {{ subject }}
            </h2>

            <!-- Message body (what user typed in modal) -->
            <div style="background-color: #f8f9fa; padding: 25px; border-radius: 6px; margin: 20px 0; border-left: 4px solid #007bff;">
                {{ message|linebreaks }}
            </div>

            <!-- Footer note -->
            <p style="margin: 20px 0 0 0; color: #6c757d; font-size: 14px;">
                This email is in response to your inquiry submitted to Rasant Solutions.
            </p>

            <p style="margin: 25px 0 0 0; color: #333333;">
                Best regards,<br>
                <strong style="color: #007bff;">Rasant Solutions</strong>
            </p>
        </td>
    </tr>
</table>
{% endblock %}
