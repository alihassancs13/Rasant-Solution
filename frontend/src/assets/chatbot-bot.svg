<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -28 280 348" role="img" aria-label="Chatbot widget mascot">
  <defs>
    <linearGradient id="cwGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="55%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="cwRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD5B4"/>
      <stop offset="50%" stop-color="#E8C1D9"/>
      <stop offset="100%" stop-color="#C9C4F8"/>
    </linearGradient>
    <filter id="cwShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#8B5CF6" flood-opacity="0.28"/>
    </filter>
    <style>
      .cw-float { animation: cwFloat 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes cwFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
      .cw-orbit { animation: cwOrbit 10s linear infinite; transform-box: fill-box; transform-origin: 140px 168px; }
      @keyframes cwOrbit { to{transform:rotate(360deg)} }
      .cw-pulse { animation: cwPulse 2s ease-in-out infinite; }
      @keyframes cwPulse { 0%,100%{opacity:.45} 50%{opacity:1} }
      .cw-dot { animation: cwDot 1.1s ease-in-out infinite; }
      .cw-dot.d2 { animation-delay: .18s; }
      .cw-dot.d3 { animation-delay: .36s; }
      @keyframes cwDot { 0%,100%{transform:translateY(0);opacity:.35} 50%{transform:translateY(-4px);opacity:1} }
      .cw-bob { animation: cwBob 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .cw-bob2 { animation: cwBob 3s ease-in-out infinite .6s; transform-box: fill-box; transform-origin: center; }
      @keyframes cwBob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    </style>
  </defs>

  <ellipse cx="140" cy="298" rx="68" ry="11" fill="#8B5CF6" opacity="0.14" class="cw-pulse"/>

  <!-- Orbit mini bubbles -->
  <g class="cw-orbit" opacity="0.85">
    <g transform="translate(140,168)">
      <circle cx="0" cy="-98" r="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
      <path d="M-5 -94h10M-5 -90h6" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="85" cy="48" r="12" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
      <circle cx="85" cy="48" r="3" fill="#F59E0B"/>
    </g>
  </g>

  <circle cx="140" cy="168" r="108" fill="none" stroke="url(#cwRing)" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" class="cw-pulse"/>

  <!-- Side message cards -->
  <g class="cw-bob">
    <rect x="18" y="118" width="62" height="36" rx="12" fill="white" stroke="#E2E8F0"/>
    <path d="M28 154 L36 146 L36 154 Z" fill="white" stroke="#E2E8F0"/>
    <text x="28" y="136" font-family="Inter,Arial,sans-serif" font-size="8" fill="#64748B">Hi there!</text>
    <text x="28" y="148" font-family="Inter,Arial,sans-serif" font-size="8" fill="#94A3B8">Need help?</text>
  </g>
  <g class="cw-bob2">
    <rect x="200" y="100" width="62" height="40" rx="12" fill="#F5F3FF" stroke="#C4B5FD"/>
    <path d="M250 140 L258 132 L250 132 Z" fill="#F5F3FF" stroke="#C4B5FD"/>
    <circle class="cw-dot" cx="218" cy="122" r="3" fill="#8B5CF6"/>
    <circle class="cw-dot d2" cx="230" cy="122" r="3" fill="#EC4899"/>
    <circle class="cw-dot d3" cx="242" cy="122" r="3" fill="#F59E0B"/>
  </g>

  <!-- Main chat launcher -->
  <g class="cw-float" filter="url(#cwShadow)">
    <circle cx="140" cy="168" r="62" fill="url(#cwGrad)"/>
    <circle cx="140" cy="168" r="54" fill="none" stroke="white" stroke-width="2" opacity="0.2"/>

    <!-- Chat bubble icon -->
    <g transform="translate(140,158)">
      <rect x="-34" y="-30" width="68" height="48" rx="16" fill="white" opacity="0.95"/>
      <path d="M-14 18 L-6 28 L-6 18 Z" fill="white" opacity="0.95"/>
      <path d="M-18 -8h36" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>
      <path d="M-18 2h24" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>
      <path d="M-18 12h30" stroke="#E9D5FF" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Notification dot -->
    <circle cx="182" cy="126" r="10" fill="#F59E0B" stroke="white" stroke-width="2.5"/>
    <text x="182" y="130" text-anchor="middle" font-family="Space Grotesk,Arial,sans-serif" font-size="9" font-weight="800" fill="white">3</text>
  </g>

  <g opacity="0.95">
    <rect x="22" y="22" width="92" height="32" rx="16" fill="white" stroke="#E2E8F0"/>
    <circle cx="38" cy="38" r="5" fill="#34D399" class="cw-pulse"/>
    <text x="50" y="42" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#059669">ONLINE</text>
    <rect x="166" y="22" width="92" height="32" rx="16" fill="white" stroke="#E2E8F0"/>
    <text x="212" y="42" text-anchor="middle" font-family="Space Grotesk,Arial,sans-serif" font-size="11" font-weight="800" fill="#7C3AED">632 chats</text>
  </g>
</svg>
