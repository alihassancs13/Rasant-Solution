<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" role="img" aria-label="Contact Rasant Solutions">
  <defs>
    <linearGradient id="cvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F3"/>
      <stop offset="45%" stop-color="#F5F0FF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="cvNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A5F9E"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
    <linearGradient id="cvLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4A90E2" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="cvSh" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2A5F9E" flood-opacity="0.1"/>
    </filter>
    <style>
      .cv-flow { stroke-dasharray:8 6; animation: cvFlow 1.2s linear infinite; }
      @keyframes cvFlow { to { stroke-dashoffset:-28; } }
      .cv-pulse { animation: cvPulse 2.5s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes cvPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
      .cv-float { animation: cvFloat 4s ease-in-out infinite; }
      .cv-float.f2 { animation-delay:-1.4s; }
      .cv-float.f3 { animation-delay:-2.8s; }
      @keyframes cvFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
      .cv-blink { animation: cvBlink 1.8s ease-in-out infinite; }
      @keyframes cvBlink { 0%,100%{opacity:.45} 50%{opacity:1} }
    </style>
  </defs>

  <rect width="520" height="380" rx="18" fill="url(#cvBg)" stroke="#CBD5E1"/>

  <path class="cv-flow" d="M260 188 L96 96" fill="none" stroke="url(#cvLine)" stroke-width="2"/>
  <path class="cv-flow" d="M260 188 L424 96" fill="none" stroke="url(#cvLine)" stroke-width="2"/>
  <path class="cv-flow" d="M260 188 L96 280" fill="none" stroke="url(#cvLine)" stroke-width="2"/>
  <path class="cv-flow" d="M260 188 L424 280" fill="none" stroke="url(#cvLine)" stroke-width="2"/>

  <g class="cv-pulse" filter="url(#cvSh)">
    <rect x="218" y="150" width="84" height="76" rx="16" fill="url(#cvNavy)"/>
    <text x="260" y="182" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF" font-family="Inter,Arial,sans-serif">RASANT</text>
    <path d="M238 198h44l-6 14H244l-6-14z" fill="#FFFFFF" opacity="0.95"/>
    <path d="M244 204h32v8H244z" fill="#4A90E2" opacity="0.5"/>
  </g>

  <g class="cv-float" filter="url(#cvSh)">
    <rect x="36" y="52" width="120" height="68" rx="12" fill="#FFFFFF" stroke="#5EEAD4"/>
    <text x="96" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#0F766E" font-family="Inter,Arial,sans-serif">Your message</text>
    <text x="96" y="96" text-anchor="middle" font-size="8" fill="#64748B" font-family="Inter,Arial,sans-serif">Project brief sent</text>
    <rect x="52" y="104" width="88" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="52" y="114" width="64" height="6" rx="3" fill="#E2E8F0"/>
  </g>

  <g class="cv-float f2" filter="url(#cvSh)">
    <rect x="364" y="52" width="120" height="68" rx="12" fill="#FFFFFF" stroke="#7DD3FC"/>
    <text x="424" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#2A5F9E" font-family="Inter,Arial,sans-serif">Team review</text>
    <text x="424" y="96" text-anchor="middle" font-size="8" fill="#64748B" font-family="Inter,Arial,sans-serif">Within 24 hours</text>
    <circle cx="404" cy="112" r="10" fill="#4A90E2" opacity="0.15"/>
    <circle cx="424" cy="112" r="10" fill="#8FB9F4" opacity="0.25"/>
    <circle cx="444" cy="112" r="10" fill="#C9C4F8" opacity="0.35"/>
  </g>

  <g class="cv-float f3" filter="url(#cvSh)">
    <rect x="36" y="260" width="120" height="68" rx="12" fill="#FFFFFF" stroke="#93C5FD"/>
    <text x="96" y="288" text-anchor="middle" font-size="10" font-weight="700" fill="#2A5F9E" font-family="Inter,Arial,sans-serif">Free consult</text>
    <text x="96" y="304" text-anchor="middle" font-size="8" fill="#64748B" font-family="Inter,Arial,sans-serif">Video or call</text>
    <rect x="52" y="312" width="28" height="10" rx="4" fill="#2A5F9E"/>
    <rect x="84" y="312" width="28" height="10" rx="4" fill="#EFF6FF" stroke="#CBD5E1"/>
  </g>

  <g class="cv-float" filter="url(#cvSh)">
    <rect x="364" y="260" width="120" height="68" rx="12" fill="#FFFFFF" stroke="#FDBA74"/>
    <text x="424" y="288" text-anchor="middle" font-size="10" font-weight="700" fill="#C2410C" font-family="Inter,Arial,sans-serif">Proposal</text>
    <text x="424" y="304" text-anchor="middle" font-size="8" fill="#64748B" font-family="Inter,Arial,sans-serif">Scope + estimate</text>
    <rect x="388" y="312" width="72" height="8" rx="4" fill="#14B8A6" opacity="0.35"/>
  </g>

  <rect x="148" y="338" width="224" height="30" rx="15" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.5"/>
  <circle class="cv-blink" cx="168" cy="353" r="4.5" fill="#14B8A6"/>
  <text x="184" y="357" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="600" fill="#1E3A5F">Average response time: under 24 hours</text>
</svg>
