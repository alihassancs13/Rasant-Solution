<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 320" role="img" aria-label="AI Agent workflow diagram">
  <defs>
    <linearGradient id="aaFlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD5B4"/>
      <stop offset="50%" stop-color="#C9C4F8"/>
      <stop offset="100%" stop-color="#4A90E2"/>
    </linearGradient>
    <clipPath id="aaHubClip"><circle cx="280" cy="152" r="40"/></clipPath>
    <filter id="aaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4A90E2" flood-opacity="0.15"/>
    </filter>
    <style>
      .aa-flow { stroke-dasharray: 6 5; animation: aaFlow 0.9s linear infinite; }
      @keyframes aaFlow { to { stroke-dashoffset: -22; } }
      .aa-pulse { animation: aaPulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes aaPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.85; } }
      .aa-fade { opacity: 0; animation: aaFade 0.6s ease forwards; }
      .aa-fade.d1{animation-delay:.05s}.aa-fade.d2{animation-delay:.15s}.aa-fade.d3{animation-delay:.25s}
      .aa-fade.d4{animation-delay:.35s}.aa-fade.d5{animation-delay:.45s}.aa-fade.d6{animation-delay:.55s}
      @keyframes aaFade { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
      .aa-spin { animation: aaSpin 8s linear infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes aaSpin { to { transform: rotate(360deg); } }
      .aa-blink { animation: aaBlink 1.5s ease-in-out infinite; }
      @keyframes aaBlink { 0%,100%{opacity:1} 50%{opacity:.4} }
    </style>
  </defs>

  <g class="aa-fade d1" filter="url(#aaShadow)">
    <rect x="20" y="100" width="130" height="120" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="85" y="128" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#1E3A5F">Triggers</text>
    <rect x="36" y="142" width="98" height="22" rx="6" fill="#EFF6FF" stroke="#8FB9F4" stroke-width="1"/>
    <text x="85" y="157" text-anchor="middle" font-size="8" fill="#2A5F9E" font-family="Inter,Arial,sans-serif">Incoming call</text>
    <rect x="36" y="170" width="98" height="22" rx="6" fill="#FDF2F8" stroke="#E8C1D9" stroke-width="1"/>
    <text x="85" y="185" text-anchor="middle" font-size="8" fill="#7C3AED" font-family="Inter,Arial,sans-serif">Chat / Email</text>
    <rect x="36" y="198" width="98" height="22" rx="6" fill="#FFF7ED" stroke="#FFD5B4" stroke-width="1"/>
    <text x="85" y="213" text-anchor="middle" font-size="8" fill="#C2410C" font-family="Inter,Arial,sans-serif">Scheduled job</text>
  </g>

  <path class="aa-flow" d="M150 160 H195" fill="none" stroke="url(#aaFlowGrad)" stroke-width="2.5"/>
  <polygon points="195,155 205,160 195,165" fill="#4A90E2"/>

  <g class="aa-fade d2" filter="url(#aaShadow)">
    <circle class="aa-spin" cx="280" cy="160" r="58" fill="none" stroke="url(#aaFlowGrad)" stroke-width="2" stroke-dasharray="6 8" opacity="0.5"/>
    <circle class="aa-pulse" cx="280" cy="160" r="48" fill="#EFF6FF" stroke="#8FB9F4" stroke-width="2"/>
    <image href="../images/ai-agent-face.png" x="240" y="112" width="80" height="80" clip-path="url(#aaHubClip)" preserveAspectRatio="xMidYMid slice"/>
    <text x="280" y="186" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700" fill="#2A5F9E">AI AGENT</text>
    <text x="280" y="198" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="7" fill="#64748B">Reason - Act - Learn</text>
  </g>

  <path class="aa-flow" d="M328 160 H373" fill="none" stroke="url(#aaFlowGrad)" stroke-width="2.5"/>
  <polygon points="373,155 383,160 373,165" fill="#4A90E2"/>

  <g class="aa-fade d3" filter="url(#aaShadow)">
    <rect x="385" y="100" width="130" height="120" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="450" y="128" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#1E3A5F">Actions</text>
    <rect x="401" y="142" width="98" height="22" rx="6" fill="#ECFDF5" stroke="#34D399" stroke-width="1"/>
    <text x="450" y="157" text-anchor="middle" font-size="8" fill="#047857" font-family="Inter,Arial,sans-serif">Assign call</text>
    <rect x="401" y="170" width="98" height="22" rx="6" fill="#EFF6FF" stroke="#8FB9F4" stroke-width="1"/>
    <text x="450" y="185" text-anchor="middle" font-size="8" fill="#2A5F9E" font-family="Inter,Arial,sans-serif">Update CRM</text>
    <rect x="401" y="198" width="98" height="22" rx="6" fill="#F5F3FF" stroke="#C9C4F8" stroke-width="1"/>
    <text x="450" y="213" text-anchor="middle" font-size="8" fill="#6D28D9" font-family="Inter,Arial,sans-serif">Create ticket</text>
  </g>

  <path class="aa-flow" d="M515 160 H560" fill="none" stroke="url(#aaFlowGrad)" stroke-width="2.5"/>
  <polygon points="560,155 570,160 560,165" fill="#4A90E2"/>

  <g class="aa-fade d4" filter="url(#aaShadow)">
    <rect x="572" y="80" width="150" height="160" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="647" y="108" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#1E3A5F">Your Systems</text>
    <rect x="588" y="122" width="118" height="28" rx="8" fill="white" stroke="#E2E8F0"/>
    <text x="647" y="140" text-anchor="middle" font-size="8" font-weight="600" fill="#475569" font-family="Inter,Arial,sans-serif">Sentra AI / Calls</text>
    <rect x="588" y="158" width="118" height="28" rx="8" fill="white" stroke="#E2E8F0"/>
    <text x="647" y="176" text-anchor="middle" font-size="8" font-weight="600" fill="#475569" font-family="Inter,Arial,sans-serif">CRM / Salesforce</text>
    <rect x="588" y="194" width="118" height="28" rx="8" fill="white" stroke="#E2E8F0"/>
    <text x="647" y="212" text-anchor="middle" font-size="8" font-weight="600" fill="#475569" font-family="Inter,Arial,sans-serif">Jira / Slack / Email</text>
  </g>

  <g class="aa-fade d5" filter="url(#aaShadow)">
    <rect x="748" y="100" width="132" height="120" rx="14" fill="white" stroke="#8FB9F4" stroke-width="1.5"/>
    <text x="814" y="128" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A5F" font-family="Inter,Arial,sans-serif">Live Analytics</text>
    <text x="770" y="158" font-size="18" font-weight="800" fill="#2A5F9E" font-family="Space Grotesk,Arial,sans-serif">130</text>
    <text x="770" y="172" font-size="7" fill="#64748B" font-family="Inter,Arial,sans-serif">Live calls</text>
    <text x="850" y="158" font-size="18" font-weight="800" fill="#7C3AED" font-family="Space Grotesk,Arial,sans-serif">2</text>
    <text x="850" y="172" font-size="7" fill="#64748B" font-family="Inter,Arial,sans-serif">Agents</text>
    <rect x="762" y="188" width="104" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="762" y="188" width="72" height="6" rx="3" fill="#4A90E2" class="aa-pulse"/>
    <text x="814" y="210" text-anchor="middle" font-size="7" fill="#64748B" font-family="Inter,Arial,sans-serif">100% agents online</text>
  </g>

  <path class="aa-flow" d="M722 160 H738" fill="none" stroke="#8FB9F4" stroke-width="2"/>

  <g class="aa-fade d6">
    <rect x="120" y="268" width="660" height="36" rx="18" fill="rgba(74,144,226,0.06)" stroke="rgba(74,144,226,0.15)"/>
    <circle cx="148" cy="286" r="4" fill="#34D399" class="aa-blink"/>
    <text x="450" y="290" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" fill="#475569">Integrates with Sentra AI or deploys standalone into your existing stack</text>
  </g>
</svg>
