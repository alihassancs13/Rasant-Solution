<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="8 12 264 308" role="img" aria-label="Voice AI agent">
  <defs>
    <linearGradient id="aaRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD5B4"/>
      <stop offset="50%" stop-color="#8FB9F4"/>
      <stop offset="100%" stop-color="#2A5F9E"/>
    </linearGradient>
    <filter id="aaShadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4A90E2" flood-opacity="0.24"/>
    </filter>
    <style>
      .aa-orbit { animation: aaOrbit 10s linear infinite; transform-box: fill-box; transform-origin: 140px 158px; }
      @keyframes aaOrbit { to{transform:rotate(360deg)} }
      .aa-pulse { animation: aaPulse 2s ease-in-out infinite; }
      @keyframes aaPulse { 0%,100%{opacity:.45} 50%{opacity:1} }
      .aa-wave { animation: aaWave 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; }
      .aa-wave.w2 { animation-delay: .2s; }
      .aa-wave.w3 { animation-delay: .4s; }
      @keyframes aaWave { 0%,100%{transform:scaleY(.55)} 50%{transform:scaleY(1)} }
    </style>
  </defs>

  <ellipse cx="140" cy="158" rx="102" ry="118" fill="#4A90E2" opacity="0.07"/>
  <ellipse cx="140" cy="286" rx="64" ry="9" fill="#4A90E2" opacity="0.12" class="aa-pulse"/>

  <g class="aa-orbit" opacity="0.82">
    <g transform="translate(140,158)">
      <circle cx="0" cy="-96" r="13" fill="#EFF6FF" stroke="#8FB9F4" stroke-width="1.5"/>
      <path d="M-4 -92h8M-4 -88h5" stroke="#2A5F9E" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="88" cy="42" r="11" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
      <circle cx="88" cy="42" r="3" fill="#14B8A6"/>
    </g>
  </g>

  <circle cx="140" cy="158" r="106" fill="none" stroke="url(#aaRing)" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.42" class="aa-pulse"/>

  <g filter="url(#aaShadow)">
    <image href="../images/ai-agent-face.png" x="58" y="32" width="164" height="204" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g transform="translate(198,108)" fill="#4A90E2" opacity="0.85">
    <rect class="aa-wave" x="0" y="8" width="3" height="10" rx="1.5"/>
    <rect class="aa-wave w2" x="6" y="4" width="3" height="18" rx="1.5"/>
    <rect class="aa-wave w3" x="12" y="6" width="3" height="14" rx="1.5"/>
    <rect class="aa-wave" x="18" y="2" width="3" height="22" rx="1.5"/>
  </g>

  <g opacity="0.95">
    <rect x="18" y="22" width="88" height="32" rx="16" fill="white" stroke="#E2E8F0"/>
    <circle cx="34" cy="38" r="5" fill="#34D399" class="aa-pulse"/>
    <text x="46" y="42" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#059669">ONLINE</text>
    <rect x="158" y="22" width="96" height="32" rx="16" fill="white" stroke="#E2E8F0"/>
    <text x="206" y="42" text-anchor="middle" font-family="Space Grotesk,Arial,sans-serif" font-size="11" font-weight="800" fill="#2A5F9E">130 calls</text>
  </g>
</svg>
