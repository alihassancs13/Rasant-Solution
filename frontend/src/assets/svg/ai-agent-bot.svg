<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-label="Professional AI voice agent robot">
  <defs>
    <linearGradient id="aaShell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="aaAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A90E2"/>
      <stop offset="55%" stop-color="#6B52B8"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <radialGradient id="aaCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A90E2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4A90E2" stop-opacity="0"/>
    </radialGradient>
    <filter id="aaShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4A90E2" flood-opacity="0.18"/>
    </filter>
    <style>
      .aa-eye { animation: aaBlink 4s ease-in-out infinite; }
      @keyframes aaBlink { 0%,92%,100%{transform:scaleY(1)} 96%{transform:scaleY(0.12)} }
      .aa-bar { animation: aaBar 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
      .aa-bar.b2 { animation-delay: .15s; }
      .aa-bar.b3 { animation-delay: .3s; }
      .aa-bar.b4 { animation-delay: .45s; }
      .aa-bar.b5 { animation-delay: .6s; }
      @keyframes aaBar { 0%,100%{transform:scaleY(.55)} 50%{transform:scaleY(1)} }
      .aa-pulse { animation: aaPulse 2.4s ease-in-out infinite; }
      @keyframes aaPulse { 0%,100%{opacity:.55} 50%{opacity:1} }
      .aa-ring { animation: aaRing 10s linear infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes aaRing { to { transform: rotate(360deg); } }
    </style>
  </defs>

  <ellipse cx="200" cy="502" rx="118" ry="11" fill="#4A90E2" opacity="0.1"/>

  <g filter="url(#aaShadow)">
  <!-- antenna -->
  <line x1="200" y1="34" x2="200" y2="62" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round"/>
  <circle class="aa-pulse" cx="200" cy="26" r="9" fill="#4A90E2"/>
  <circle cx="200" cy="26" r="4.5" fill="#8FB9F4"/>

  <!-- head -->
  <rect x="124" y="62" width="152" height="118" rx="30" fill="url(#aaShell)" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="142" y="82" width="116" height="78" rx="18" fill="#1E3A5F"/>
  <rect x="142" y="82" width="116" height="18" rx="18" fill="#2A5F9E" opacity="0.45"/>

  <!-- eyes -->
  <g class="aa-eye" style="transform-origin:176px 124px">
    <circle cx="176" cy="124" r="11" fill="#14B8A6"/>
    <circle cx="180" cy="120" r="3.5" fill="#FFFFFF" opacity="0.85"/>
  </g>
  <g class="aa-eye" style="transform-origin:224px 124px">
    <circle cx="224" cy="124" r="11" fill="#14B8A6"/>
    <circle cx="228" cy="120" r="3.5" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- voice bars -->
  <rect class="aa-bar" x="166" y="142" width="5" height="14" rx="2.5" fill="#4A90E2"/>
  <rect class="aa-bar b2" x="176" y="138" width="5" height="18" rx="2.5" fill="#6B52B8"/>
  <rect class="aa-bar b3" x="186" y="140" width="5" height="16" rx="2.5" fill="#4A90E2"/>
  <rect class="aa-bar b4" x="196" y="136" width="5" height="20" rx="2.5" fill="#14B8A6"/>
  <rect class="aa-bar b5" x="206" y="140" width="5" height="16" rx="2.5" fill="#4A90E2"/>
  <rect class="aa-bar b3" x="216" y="138" width="5" height="18" rx="2.5" fill="#6B52B8"/>
  <rect class="aa-bar b2" x="226" y="142" width="5" height="14" rx="2.5" fill="#4A90E2"/>

  <!-- ear panels -->
  <rect x="108" y="102" width="14" height="44" rx="7" fill="#F1F5F9" stroke="#E2E8F0"/>
  <rect x="278" y="102" width="14" height="44" rx="7" fill="#F1F5F9" stroke="#E2E8F0"/>

  <!-- neck -->
  <rect x="176" y="180" width="48" height="22" rx="10" fill="#CBD5E1"/>

  <!-- torso -->
  <rect x="102" y="202" width="196" height="168" rx="34" fill="url(#aaShell)" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="102" y="202" width="196" height="34" rx="34" fill="#FFFFFF" opacity="0.55"/>

  <!-- chest core -->
  <circle cx="200" cy="286" r="54" fill="url(#aaCoreGlow)"/>
  <circle class="aa-ring" cx="200" cy="286" r="46" fill="none" stroke="url(#aaAccent)" stroke-width="2" stroke-dasharray="6 8" opacity="0.75"/>
  <circle cx="200" cy="286" r="34" fill="#F8FAFC" stroke="#4A90E2" stroke-width="2"/>
  <circle cx="200" cy="286" r="14" fill="#4A90E2"/>
  <circle cx="200" cy="286" r="6" fill="#FFFFFF" opacity="0.9"/>

  <!-- shoulder accents -->
  <rect x="118" y="228" width="28" height="6" rx="3" fill="#4A90E2" opacity="0.25"/>
  <rect x="254" y="228" width="28" height="6" rx="3" fill="#4A90E2" opacity="0.25"/>

  <!-- arms -->
  <rect x="64" y="214" width="38" height="108" rx="19" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="83" cy="332" r="22" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="83" cy="332" r="8" fill="#4A90E2" opacity="0.35"/>

  <rect x="298" y="214" width="38" height="108" rx="19" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="317" cy="332" r="22" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="317" cy="332" r="8" fill="#14B8A6" opacity="0.45"/>

  <!-- legs -->
  <rect x="132" y="370" width="56" height="112" rx="22" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="212" y="370" width="56" height="112" rx="22" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- feet -->
  <rect x="116" y="472" width="72" height="24" rx="12" fill="#1E3A5F"/>
  <rect x="212" y="472" width="72" height="24" rx="12" fill="#1E3A5F"/>
  </g>
</svg>
