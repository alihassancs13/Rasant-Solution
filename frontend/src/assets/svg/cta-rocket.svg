<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <radialGradient id="rocketGlow" cx="50%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="250" cy="240" rx="240" ry="170" fill="url(#rocketGlow)"/>

  <!-- Grid lines (space grid) -->
  <line x1="0" y1="300" x2="500" y2="300" stroke="#2563EB" stroke-width="0.5" opacity="0.2"/>
  <line x1="0" y1="340" x2="500" y2="340" stroke="#2563EB" stroke-width="0.5" opacity="0.1"/>
  <line x1="100" y1="260" x2="100" y2="400" stroke="#2563EB" stroke-width="0.5" opacity="0.15"/>
  <line x1="200" y1="260" x2="200" y2="400" stroke="#2563EB" stroke-width="0.5" opacity="0.15"/>
  <line x1="300" y1="260" x2="300" y2="400" stroke="#2563EB" stroke-width="0.5" opacity="0.15"/>
  <line x1="400" y1="260" x2="400" y2="400" stroke="#2563EB" stroke-width="0.5" opacity="0.15"/>

  <!-- Exhaust flame -->
  <ellipse cx="250" cy="295" rx="18" ry="30" fill="#F59E0B" opacity="0.7"/>
  <ellipse cx="250" cy="300" rx="12" ry="22" fill="#FBBF24" opacity="0.6"/>
  <ellipse cx="250" cy="305" rx="7" ry="14" fill="white" opacity="0.4"/>
  <!-- Side flames -->
  <ellipse cx="232" cy="298" rx="8" ry="16" fill="#F59E0B" opacity="0.4" transform="rotate(-10 232 298)"/>
  <ellipse cx="268" cy="298" rx="8" ry="16" fill="#F59E0B" opacity="0.4" transform="rotate(10 268 298)"/>

  <!-- Rocket body -->
  <path d="M250,80 C250,80 220,140 218,220 L282,220 C280,140 250,80 250,80 Z" fill="#1E293B" stroke="#2563EB" stroke-width="2"/>
  <!-- Rocket nose cone -->
  <path d="M218,220 C218,220 220,235 250,240 C280,235 282,220 282,220 Z" fill="#2563EB" opacity="0.6"/>
  <!-- Rocket window -->
  <circle cx="250" cy="170" r="18" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="250" cy="170" r="12" fill="#1E3A5F"/>
  <circle cx="250" cy="170" r="7" fill="#38BDF8" opacity="0.3"/>
  <circle cx="246" cy="166" r="3" fill="white" opacity="0.5"/>
  <!-- Rocket fins -->
  <path d="M218,220 L195,260 L218,248 Z" fill="#2563EB" opacity="0.7"/>
  <path d="M282,220 L305,260 L282,248 Z" fill="#2563EB" opacity="0.7"/>
  <!-- Rocket highlight stripe -->
  <rect x="244" y="120" width="6" height="80" rx="3" fill="#38BDF8" opacity="0.3"/>

  <!-- Stars -->
  <circle cx="80" cy="80" r="2" fill="white" opacity="0.7"/>
  <circle cx="150" cy="40" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="340" cy="60" r="2" fill="white" opacity="0.7"/>
  <circle cx="420" cy="110" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="60" cy="190" r="1.5" fill="#38BDF8" opacity="0.7"/>
  <circle cx="450" cy="170" r="2" fill="#A78BFA" opacity="0.7"/>
  <circle cx="380" cy="250" r="1.5" fill="#34D399" opacity="0.6"/>
  <circle cx="120" cy="310" r="2" fill="#38BDF8" opacity="0.4"/>

  <!-- Orbit path dot -->
  <ellipse cx="250" cy="200" rx="140" ry="50" stroke="#38BDF8" stroke-width="1" stroke-dasharray="5,6" fill="none" opacity="0.2"/>
  <circle cx="390" cy="200" r="5" fill="#A78BFA" opacity="0.7"/>
  <circle cx="110" cy="200" r="5" fill="#34D399" opacity="0.7"/>
</svg>
