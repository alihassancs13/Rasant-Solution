<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" role="img" aria-label="AI Agent workspace overview">
  <defs>
    <linearGradient id="wsBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="25%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <style>
      .ws-bar { transform-origin: left; animation: wsBarGrow 1.5s ease forwards; transform: scaleX(0); }
      @keyframes wsBarGrow { to { transform: scaleX(1); } }
      .ws-card { opacity: 0; animation: wsCard 0.6s ease forwards; }
      .ws-card.c1{animation-delay:.1s}.ws-card.c2{animation-delay:.2s}
      @keyframes wsCard { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    </style>
  </defs>

  <g class="ws-card c1">
    <rect x="0" y="0" width="440" height="200" rx="12" fill="white" stroke="#E2E8F0"/>
    <text x="20" y="32" font-size="14" font-weight="700" fill="#059669" font-family="Inter,Arial,sans-serif">Agent Availability</text>
    <rect x="330" y="16" width="90" height="22" rx="11" fill="#D1FAE5"/>
    <text x="375" y="31" text-anchor="middle" font-size="9" font-weight="700" fill="#059669" font-family="Inter,Arial,sans-serif">100% online</text>
    <text x="20" y="52" font-size="9" fill="#94A3B8" font-family="Inter,Arial,sans-serif">2 AI agents in your workspace</text>
    <rect x="20" y="68" width="400" height="10" rx="5" fill="#F1F5F9"/>
    <rect class="ws-bar" x="20" y="68" width="400" height="10" rx="5" fill="url(#wsBar)"/>
    <text x="60" y="110" text-anchor="middle" font-size="28" font-weight="800" fill="#1E293B" font-family="Space Grotesk,Arial,sans-serif">2</text>
    <text x="60" y="128" text-anchor="middle" font-size="9" fill="#64748B" font-family="Inter,Arial,sans-serif">Available</text>
    <text x="220" y="110" text-anchor="middle" font-size="28" font-weight="800" fill="#1E293B" font-family="Space Grotesk,Arial,sans-serif">0</text>
    <text x="220" y="128" text-anchor="middle" font-size="9" fill="#64748B" font-family="Inter,Arial,sans-serif">Busy</text>
    <text x="380" y="110" text-anchor="middle" font-size="28" font-weight="800" fill="#1E293B" font-family="Space Grotesk,Arial,sans-serif">0</text>
    <text x="380" y="128" text-anchor="middle" font-size="9" fill="#64748B" font-family="Inter,Arial,sans-serif">Offline</text>
    <rect x="20" y="148" width="90" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="65" y="168" text-anchor="middle" font-size="8" fill="#64748B" font-family="Inter,Arial,sans-serif">Contacts</text>
    <text x="65" y="184" text-anchor="middle" font-size="16" font-weight="800" fill="#2DD4BF" font-family="Space Grotesk,Arial,sans-serif">11</text>
    <rect x="120" y="148" width="90" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="165" y="168" text-anchor="middle" font-size="8" fill="#64748B" font-family="Inter,Arial,sans-serif">Campaigns</text>
    <text x="165" y="184" text-anchor="middle" font-size="16" font-weight="800" fill="#F59E0B" font-family="Space Grotesk,Arial,sans-serif">3</text>
    <rect x="220" y="148" width="90" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="265" y="168" text-anchor="middle" font-size="8" fill="#64748B" font-family="Inter,Arial,sans-serif">Uploads</text>
    <text x="265" y="184" text-anchor="middle" font-size="16" font-weight="800" fill="#8B5CF6" font-family="Space Grotesk,Arial,sans-serif">12</text>
    <rect x="320" y="148" width="100" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="370" y="168" text-anchor="middle" font-size="8" fill="#64748B" font-family="Inter,Arial,sans-serif">Tokens Used</text>
    <text x="370" y="184" text-anchor="middle" font-size="16" font-weight="800" fill="#2DD4BF" font-family="Space Grotesk,Arial,sans-serif">130.7K</text>
  </g>

  <g class="ws-card c2">
    <rect x="460" y="0" width="460" height="200" rx="12" fill="white" stroke="#E2E8F0"/>
    <text x="480" y="32" font-size="14" font-weight="700" fill="#EA580C" font-family="Inter,Arial,sans-serif">Quick Access</text>
    <text x="480" y="52" font-size="9" fill="#94A3B8" font-family="Inter,Arial,sans-serif">Jump into key modules</text>
    <g font-family="Inter,Arial,sans-serif" font-size="10" fill="#475569">
      <rect x="480" y="68" width="130" height="36" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><text x="545" y="91" text-anchor="middle">Agents</text>
      <rect x="620" y="68" width="130" height="36" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><text x="685" y="91" text-anchor="middle">Live Calls</text>
      <rect x="760" y="68" width="130" height="36" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><text x="825" y="91" text-anchor="middle">Workspace</text>
      <rect x="480" y="112" width="130" height="36" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><text x="545" y="135" text-anchor="middle">Call Queue</text>
      <rect x="620" y="112" width="130" height="36" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><text x="685" y="135" text-anchor="middle">Subscription</text>
      <rect x="760" y="112" width="130" height="36" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><text x="825" y="135" text-anchor="middle">Campaigns</text>
    </g>
    <rect x="480" y="160" width="410" height="28" rx="8" fill="rgba(42,95,158,0.08)" stroke="rgba(42,95,158,0.15)"/>
    <text x="685" y="178" text-anchor="middle" font-size="9" fill="#2A5F9E" font-family="Inter,Arial,sans-serif">Round-robin assignment - Auto-assign enabled</text>
  </g>
</svg>
