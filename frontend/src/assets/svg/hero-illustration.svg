<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" fill="none" role="img" aria-label="Rasant Solutions engineering and delivery">
  <defs>
    <linearGradient id="hiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F3"/>
      <stop offset="40%" stop-color="#F5F0FF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="hiNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A5F9E"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
    <linearGradient id="hiHub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD5B4"/>
      <stop offset="45%" stop-color="#C9C4F8"/>
      <stop offset="100%" stop-color="#4A90E2"/>
    </linearGradient>
    <filter id="hiSh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#2A5F9E" flood-opacity="0.12"/>
    </filter>
    <filter id="hiShSm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2A5F9E" flood-opacity="0.1"/>
    </filter>
    <style>
      .hi-float { animation: hiFloat 4s ease-in-out infinite; }
      .hi-float.f2 { animation-delay: -1.3s; }
      .hi-float.f3 { animation-delay: -2.6s; }
      @keyframes hiFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
      .hi-pulse { animation: hiPulse 2.5s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes hiPulse { 0%,100%{opacity:.85} 50%{opacity:1} }
      .hi-bar { transform-origin:bottom; animation: hiBar 2s ease-in-out infinite alternate; }
      .hi-bar.b2 { animation-delay:-.5s; }
      .hi-bar.b3 { animation-delay:-1s; }
      @keyframes hiBar { from{transform:scaleY(.6)} to{transform:scaleY(1)} }
      .hi-ring { animation: hiRing 18s linear infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes hiRing { to { transform:rotate(360deg); } }
    </style>
