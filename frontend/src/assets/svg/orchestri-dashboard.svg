<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-label="Orchestri pipeline progress and workflow console">
  <defs>
    <filter id="odSh"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4338CA" flood-opacity="0.1"/></filter>
    <linearGradient id="odBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="55%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#4A90E2"/>
    </linearGradient>
    <style>
      .od-pulse{animation:odPulse 2s ease-in-out infinite}
      @keyframes odPulse{0%,100%{opacity:1}50%{opacity:.4}}
      .od-flow{stroke-dasharray:6 4;animation:odFlow 1.2s linear infinite}
      @keyframes odFlow{to{stroke-dashoffset:-20}}
      .od-in{opacity:0;animation:odIn .65s ease forwards}
      .od-in.d1{animation-delay:.08s}.od-in.d2{animation-delay:.16s}.od-in.d3{animation-delay:.24s}
      @keyframes odIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    </style>
  </defs>
  <rect width="960" height="580" rx="16" fill="#F8FAFC"/>

  <!-- Pipeline progress panel -->
  <g class="od-in" filter="url(#odSh)">
    <rect x="20" y="20" width="920" height="168" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="20" y="20" width="920" height="4" rx="14" fill="url(#odBar)"/>
    <text x="40" y="52" font-family="Space Grotesk,sans-serif" font-size="13" font-weight="800" fill="#1E3A5F">Pipeline progress</text>
    <text x="40" y="70" font-family="Inter,sans-serif" font-size="9" fill="#64748B">Run #b7e3 · payments-service · monorepo/main</text>
    <rect x="780" y="38" width="72" height="24" rx="12" fill="#CCFBF1"/>
    <circle cx="794" cy="50" r="5" fill="#14B8A6" class="od-pulse"/>
    <text x="806" y="54" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#0F766E">LIVE</text>
    <text x="868" y="54" font-family="Inter,sans-serif" font-size="9" fill="#64748B">62%</text>

    <!-- Stage track -->
    <rect x="40" y="88" width="880" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="40" y="88" width="548" height="8" rx="4" fill="url(#odBar)"/>

    <!-- Stages -->
    <g font-family="Inter,sans-serif">
      <circle cx="68" cy="92" r="10" fill="#6366F1" stroke="#FFFFFF" stroke-width="2"/><text x="68" y="118" text-anchor="middle" font-size="8" font-weight="600" fill="#4338CA">Setup</text>
      <circle cx="196" cy="92" r="10" fill="#6366F1" stroke="#FFFFFF" stroke-width="2"/><text x="196" y="118" text-anchor="middle" font-size="8" font-weight="600" fill="#4338CA">Spec</text>
      <circle cx="324" cy="92" r="10" fill="#6366F1" stroke="#FFFFFF" stroke-width="2"/><text x="324" y="118" text-anchor="middle" font-size="8" font-weight="600" fill="#4338CA">Plan</text>
      <circle cx="452" cy="92" r="12" fill="#14B8A6" stroke="#FFFFFF" stroke-width="3"/><text x="452" y="118" text-anchor="middle" font-size="8" font-weight="700" fill="#0F766E">Implement</text>
      <circle cx="580" cy="92" r="10" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/><text x="580" y="118" text-anchor="middle" font-size="8" fill="#94A3B8">Test</text>
      <circle cx="708" cy="92" r="10" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/><text x="708" y="118" text-anchor="middle" font-size="8" fill="#94A3B8">Deploy</text>
      <circle cx="836" cy="92" r="10" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/><text x="836" y="118" text-anchor="middle" font-size="8" fill="#94A3B8">Finish</text>
    </g>

    <!-- Mini KPIs -->
    <rect x="40" y="134" width="140" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="52" y="152" font-family="Inter,sans-serif" font-size="8" fill="#64748B">Tasks done</text>
    <text x="52" y="168" font-family="Space Grotesk,sans-serif" font-size="14" font-weight="800" fill="#1E3A5F">8 / 12</text>
    <rect x="192" y="134" width="140" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="204" y="152" font-family="Inter,sans-serif" font-size="8" fill="#64748B">Tests passing</text>
    <text x="204" y="168" font-family="Space Grotesk,sans-serif" font-size="14" font-weight="800" fill="#22C55E">14 / 16</text>
    <rect x="344" y="134" width="140" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="356" y="152" font-family="Inter,sans-serif" font-size="8" fill="#64748B">Debug retries</text>
    <text x="356" y="168" font-family="Space Grotesk,sans-serif" font-size="14" font-weight="800" fill="#F59E0B">1 / 4</text>
    <rect x="496" y="134" width="200" height="40" rx="8" fill="#EFF6FF" stroke="#4A90E2"/>
    <text x="508" y="152" font-family="Inter,sans-serif" font-size="8" fill="#2A5F9E">Current agent</text>
    <text x="508" y="168" font-family="Inter,sans-serif" font-size="10" font-weight="700" fill="#1E3A5F">Code agent · writing orders.py</text>
  </g>

  <!-- Workflow console -->
  <g class="od-in d1" filter="url(#odSh)">
    <rect x="20" y="208" width="920" height="352" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="20" y="208" width="920" height="44" rx="14" fill="#1E3A5F"/>
    <text x="40" y="236" font-family="Space Grotesk,sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Workflow console</text>
    <rect x="200" y="220" width="72" height="22" rx="6" fill="#FFFFFF" opacity=".12"/>
    <text x="212" y="235" font-family="Inter,sans-serif" font-size="9" fill="#FFFFFF" opacity=".9">Workflow tab</text>
    <rect x="280" y="220" width="56" height="22" rx="6" fill="transparent" stroke="#FFFFFF" stroke-opacity=".25"/>
    <text x="292" y="235" font-family="Inter,sans-serif" font-size="9" fill="#FFFFFF" opacity=".6">Events</text>
    <rect x="344" y="220" width="56" height="22" rx="6" fill="transparent" stroke="#FFFFFF" stroke-opacity=".25"/>
    <text x="356" y="235" font-family="Inter,sans-serif" font-size="9" fill="#FFFFFF" opacity=".6">Artifacts</text>

    <!-- Sidebar -->
    <rect x="36" y="264" width="200" height="280" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="52" y="286" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#64748B">STAGES</text>
    <rect x="48" y="296" width="176" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="60" y="314" font-family="Inter,sans-serif" font-size="9" fill="#64748B">✓ Setup</text>
    <rect x="48" y="330" width="176" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="60" y="348" font-family="Inter,sans-serif" font-size="9" fill="#64748B">✓ Specification</text>
    <rect x="48" y="364" width="176" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="60" y="382" font-family="Inter,sans-serif" font-size="9" fill="#64748B">✓ Plan</text>
    <rect x="48" y="398" width="176" height="32" rx="6" fill="#F0FDF4" stroke="#14B8A6" stroke-width="2"/><text x="60" y="418" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#0F766E">● Implementation</text>
    <rect x="48" y="436" width="176" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="60" y="454" font-family="Inter,sans-serif" font-size="9" fill="#94A3B8">Testing</text>
    <rect x="48" y="470" width="176" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/><text x="60" y="488" font-family="Inter,sans-serif" font-size="9" fill="#94A3B8">Commit &amp; push</text>
    <rect x="48" y="506" width="176" height="26" rx="6" fill="#2A5F9E"/><text x="136" y="523" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" font-weight="600" fill="#FFFFFF">Commit &amp; Push</text>

    <!-- Main content -->
    <rect x="252" y="264" width="672" height="200" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="268" y="288" font-family="Space Grotesk,sans-serif" font-size="11" font-weight="700" fill="#1E3A5F">Implementation · Task 8 of 12</text>
    <text x="268" y="306" font-family="Inter,sans-serif" font-size="9" fill="#64748B">Add idempotency key middleware to checkout endpoint</text>
    <rect x="268" y="318" width="640" height="130" rx="8" fill="#0F172A"/>
    <text x="280" y="338" font-family="monospace" font-size="8" fill="#94A3B8"># code.agent · src/api/checkout.py</text>
    <text x="280" y="356" font-family="monospace" font-size="8" fill="#818CF8">+ def with_idempotency(handler):</text>
    <text x="280" y="372" font-family="monospace" font-size="8" fill="#14B8A6">+     @wraps(handler)</text>
    <text x="280" y="388" font-family="monospace" font-size="8" fill="#E2E8F0">+     async def wrapper(request, key: str):</text>
    <text x="280" y="404" font-family="monospace" font-size="8" fill="#F59E0B">+         if cache.exists(key): return cache.get(key)</text>
    <text x="280" y="420" font-family="monospace" font-size="8" fill="#64748B">  ... 4 more lines</text>
    <rect x="268" y="436" width="48" height="18" rx="4" fill="#1E293B"/><text x="276" y="449" font-family="monospace" font-size="7" fill="#14B8A6">+42 −3</text>

    <!-- Revision + actions row -->
    <rect x="252" y="476" width="420" height="68" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="268" y="498" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#64748B">REVISION FEEDBACK</text>
    <rect x="268" y="506" width="388" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="280" y="524" font-family="Inter,sans-serif" font-size="9" fill="#94A3B8">Optional: add retry header for webhook failures…</text>

    <rect x="688" y="476" width="236" height="68" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="704" y="498" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#64748B">ACTIONS</text>
    <rect x="704" y="510" width="88" height="28" rx="6" fill="#2A5F9E"/><text x="748" y="528" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" font-weight="600" fill="#FFFFFF">Approve</text>
    <rect x="800" y="510" width="88" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/><text x="844" y="528" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#64748B">Revise</text>
    <rect x="896" y="510" width="12" height="28" rx="6" fill="#14B8A6" opacity="0"/>
  </g>
</svg>
