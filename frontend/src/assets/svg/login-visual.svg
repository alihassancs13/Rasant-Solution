<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="Rasant workspace login">
  <defs>
    <linearGradient id="lvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F3"/>
      <stop offset="45%" stop-color="#F5F0FF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="lvNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A5F9E"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
    <radialGradient id="lvGlowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A90E2" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4A90E2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lvGlowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <filter id="lvSh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1E3A5F" flood-opacity="0.14"/>
    </filter>
    <filter id="lvShBadge" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1E3A5F" flood-opacity="0.3"/>
    </filter>
    <style>
      .lv-blink { animation: lvBlink 1.8s ease-in-out infinite; }
      @keyframes lvBlink { 0%,100%{opacity:.4} 50%{opacity:1} }
      .lv-pulsering { animation: lvPulseRing 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes lvPulseRing { 0%,100%{opacity:.5} 50%{opacity:1} }
    </style>
  </defs>

  <rect width="680" height="360" rx="20" fill="url(#lvBg)" stroke="#E2E8F0"/>
  <circle cx="110" cy="70" r="100" fill="url(#lvGlowBlue)"/>
  <circle cx="570" cy="300" r="110" fill="url(#lvGlowTeal)"/>

  <circle class="lv-pulsering" cx="340" cy="172" r="110" fill="none" stroke="#2A5F9E" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="3 7"/>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 340 172" to="360 340 172" dur="26s" repeatCount="indefinite"/>

    <g filter="url(#lvSh)">
      <animateTransform attributeName="transform" type="rotate" from="0 340 62" to="-360 340 62" dur="26s" repeatCount="indefinite"/>
      <rect x="295" y="45" width="90" height="34" rx="9" fill="#FFFFFF" stroke="#5EEAD4" stroke-width="1.5"/>
      <text x="340" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#0F766E" font-family="Inter,Arial,sans-serif">Sentra AI</text>
    </g>

    <g filter="url(#lvSh)">
      <animateTransform attributeName="transform" type="rotate" from="0 340 282" to="-360 340 282" dur="26s" repeatCount="indefinite"/>
      <rect x="295" y="265" width="90" height="34" rx="9" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
      <text x="340" y="287" text-anchor="middle" font-size="13" font-weight="700" fill="#2A5F9E" font-family="Inter,Arial,sans-serif">Voice AI</text>
    </g>

    <g filter="url(#lvSh)">
      <animateTransform attributeName="transform" type="rotate" from="0 230 172" to="-360 230 172" dur="26s" repeatCount="indefinite"/>
      <rect x="185" y="155" width="90" height="34" rx="9" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="1.5"/>
      <text x="230" y="177" text-anchor="middle" font-size="13" font-weight="700" fill="#2A5F9E" font-family="Inter,Arial,sans-serif">Chatbot</text>
    </g>

    <g filter="url(#lvSh)">
      <animateTransform attributeName="transform" type="rotate" from="0 450 172" to="-360 450 172" dur="26s" repeatCount="indefinite"/>
      <rect x="405" y="155" width="90" height="34" rx="9" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.5"/>
      <text x="450" y="177" text-anchor="middle" font-size="13" font-weight="700" fill="#C2410C" font-family="Inter,Arial,sans-serif">Analytics</text>
    </g>
  </g>

  <g filter="url(#lvShBadge)">
    <rect x="304" y="136" width="72" height="72" rx="18" fill="url(#lvNavy)"/>
    <text x="340" y="181" text-anchor="middle" font-family="Space Grotesk,Arial,sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">RS</text>
  </g>

  <rect x="248" y="306" width="184" height="30" rx="15" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.5" filter="url(#lvSh)"/>
  <circle class="lv-blink" cx="266" cy="321" r="4" fill="#14B8A6"/>
  <text x="280" y="325" font-family="Inter,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1E3A5F">Secure workspace access</text>
</svg>
