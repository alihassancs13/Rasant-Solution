  <text x="20" y="398" font-family="Inter,sans-serif" font-size="10" font-weight="700" fill="#262626">1,284 likes</text>
  <text x="20" y="414" font-family="Inter,sans-serif" font-size="10" fill="#262626"><tspan font-weight="700">rasantsolutions</tspan> AI posts in seconds ✨</text>
