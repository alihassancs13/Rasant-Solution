    </linearGradient>
    <filter id="igSh"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7C3AED" flood-opacity="0.1"/></filter>
  </defs>
  <rect width="300" height="420" rx="16" fill="white" stroke="#E2E8F0" stroke-width="1.5" filter="url(#igSh)"/>
  <circle cx="36" cy="36" r="16" fill="url(#igRing)"/>
  <circle cx="36" cy="36" r="12" fill="white"/>
  <circle cx="36" cy="36" r="8" fill="url(#igRing)"/>
  <text x="62" y="40" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#262626">rasantsolutions</text>
  <text x="240" y="40" font-size="14" fill="#262626">---</text>
