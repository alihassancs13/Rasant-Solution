  <text x="150" y="190" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="20" font-weight="800" fill="white">Create. Approve.</text>
  <text x="150" y="218" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="20" font-weight="800" fill="white">Publish.</text>
  <text x="150" y="248" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="white" opacity=".9">Powered by OmniPost AI</text>
