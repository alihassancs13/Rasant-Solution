<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 360 520" role="img" aria-label="AI Assistant chat messenger">
  <defs>
    <linearGradient id="cmHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D1FAE5"/>
      <stop offset="55%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#FEFCE8"/>
    </linearGradient>
    <linearGradient id="cmUserBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="cmCardShadow" x="-12%" y="-8%" width="124%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0F766E" flood-opacity="0.14"/>
    </filter>
    <filter id="cmBubbleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748B" flood-opacity="0.12"/>
    </filter>
    <clipPath id="cmHeaderFaceClip"><circle cx="72" cy="72" r="22"/></clipPath>
    <clipPath id="cmMsgFaceClip"><circle cx="16" cy="16" r="16"/></clipPath>
    <clipPath id="cmChatClip">
      <rect x="30" y="96" width="300" height="304" rx="0"/>
    </clipPath>
    <style>
      .cm-msg-in { animation: cmMsgIn 3s ease-in-out infinite; }
      .cm-msg-out { animation: cmMsgIn 3s ease-in-out infinite .8s; }
      @keyframes cmMsgIn { 0%,100%{opacity:.88} 50%{opacity:1} }
      .cm-typing-dot { animation: cmTyping 1.2s ease-in-out infinite; }
      .cm-typing-dot.d2 { animation-delay: .2s; }
      .cm-typing-dot.d3 { animation-delay: .4s; }
      @keyframes cmTyping { 0%,100%{opacity:.35;transform:translateY(0)} 50%{opacity:1;transform:translateY(-2px)} }
      .cm-send { animation: cmSend 2.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes cmSend { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
    </style>
  </defs>

  <ellipse cx="180" cy="260" rx="118" ry="150" fill="#14B8A6" opacity="0.06"/>

  <g filter="url(#cmCardShadow)">
    <rect x="30" y="24" width="300" height="456" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Header -->
    <path d="M30 48a24 24 0 0 1 24-24h252a24 24 0 0 1 24 24v24H30Z" fill="url(#cmHeaderGrad)"/>
    <rect x="30" y="72" width="300" height="24" fill="url(#cmHeaderGrad)"/>

    <circle cx="72" cy="72" r="23" fill="#D1FAE5"/>
    <image href="../images/chatbot-face.png" x="49" y="49" width="46" height="46" clip-path="url(#cmHeaderFaceClip)" preserveAspectRatio="xMidYMid slice"/>
    <circle cx="88" cy="88" r="6" fill="#22C55E" stroke="#FFFFFF" stroke-width="2"/>

    <text x="104" y="66" font-family="Space Grotesk, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F172A">AI Assistant</text>
    <g transform="translate(104,78)">
      <path d="M0 0h8a4 4 0 0 1 4 4v2a4 4 0 0 1-4 4H3l-3 3V6a4 4 0 0 1 4-4Z" fill="#14B8A6" opacity="0.9"/>
      <text x="14" y="10" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#059669">Online - Ready to assist you</text>
    </g>

    <circle cx="306" cy="72" r="14" fill="#F1F5F9" stroke="#E2E8F0"/>
    <path d="M301 76 L306 71 L311 76" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Chat body -->
    <rect x="30" y="96" width="300" height="304" fill="#FFFFFF"/>

    <g clip-path="url(#cmChatClip)">
      <!-- Bot message -->
      <g transform="translate(48,118)">
        <g class="cm-msg-in">
          <circle cx="16" cy="16" r="16" fill="#D1FAE5"/>
          <image href="../images/chatbot-face.png" x="0" y="0" width="32" height="32" clip-path="url(#cmMsgFaceClip)" preserveAspectRatio="xMidYMid slice"/>
          <g filter="url(#cmBubbleShadow)">
            <rect x="40" y="0" width="196" height="58" rx="16" fill="#FFFFFF" stroke="#F1F5F9"/>
            <path d="M40 18 L32 24 L40 30 Z" fill="#FFFFFF"/>
          </g>
          <text x="54" y="24" font-family="Inter, Arial, sans-serif" font-size="12" fill="#334155">Hello! How can I assist you today?</text>
          <text x="54" y="48" font-family="Inter, Arial, sans-serif" font-size="9" fill="#94A3B8">12:04 PM</text>
        </g>
      </g>

      <!-- User message -->
      <g transform="translate(48,192)">
        <g class="cm-msg-out">
          <g filter="url(#cmBubbleShadow)">
            <rect x="84" y="0" width="152" height="52" rx="16" fill="url(#cmUserBubble)"/>
            <path d="M236 18 L244 24 L236 30 Z" fill="#0F766E"/>
          </g>
          <text x="98" y="24" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">How are you?</text>
          <text x="98" y="42" font-family="Inter, Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.75)">12:05 PM</text>
          <circle cx="268" cy="26" r="16" fill="#8B5CF6"/>
          <circle cx="268" cy="22" r="5" fill="#FFFFFF" opacity="0.95"/>
          <path d="M268 27c-5 0-8 2.5-8 5v1h16v-1c0-2.5-3-5-8-5Z" fill="#FFFFFF" opacity="0.95"/>
        </g>
      </g>

      <!-- Typing indicator -->
      <g transform="translate(48,262)">
        <circle cx="16" cy="16" r="16" fill="#D1FAE5"/>
        <image href="../images/chatbot-face.png" x="0" y="0" width="32" height="32" clip-path="url(#cmMsgFaceClip)" preserveAspectRatio="xMidYMid slice"/>
        <rect x="40" y="6" width="54" height="28" rx="14" fill="#FFFFFF" stroke="#F1F5F9" filter="url(#cmBubbleShadow)"/>
        <circle class="cm-typing-dot" cx="58" cy="20" r="4" fill="#14B8A6"/>
        <circle class="cm-typing-dot d2" cx="70" cy="20" r="4" fill="#2DD4BF"/>
        <circle class="cm-typing-dot d3" cx="82" cy="20" r="4" fill="#0D9488"/>
      </g>
    </g>

    <!-- Footer -->
    <line x1="48" y1="404" x2="312" y2="404" stroke="#E2E8F0" stroke-width="1"/>

    <rect x="48" y="418" width="170" height="40" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="64" y="442" font-family="Inter, Arial, sans-serif" font-size="11" fill="#94A3B8">Type your message...</text>

    <rect x="228" y="418" width="36" height="40" rx="10" fill="#F1F5F9" stroke="#E2E8F0"/>
    <rect x="240" y="430" width="8" height="12" rx="4" fill="none" stroke="#64748B" stroke-width="1.6"/>
    <path d="M236 442c0 4 3.5 6 8 6s8-2 8-6" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="244" y1="450" x2="244" y2="453" stroke="#64748B" stroke-width="1.6" stroke-linecap="round"/>

    <g class="cm-send">
      <rect x="272" y="418" width="36" height="40" rx="10" fill="#14B8A6" stroke="#0F766E"/>
      <path d="M282 434 L292 438 L282 442 Z" fill="#FFFFFF"/>
    </g>

    <g transform="translate(48,466)">
      <rect x="0" y="0" width="14" height="10" rx="2" fill="none" stroke="#CBD5E1" stroke-width="1.2"/>
      <line x1="3" y1="3" x2="11" y2="3" stroke="#CBD5E1" stroke-width="1"/>
      <line x1="3" y1="6" x2="9" y2="6" stroke="#CBD5E1" stroke-width="1"/>
      <text x="18" y="9" font-family="Inter, Arial, sans-serif" font-size="9" fill="#94A3B8">Enter to send, or</text>
    </g>
  </g>
</svg>
