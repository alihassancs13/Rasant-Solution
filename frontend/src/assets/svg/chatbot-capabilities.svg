<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Chatbot capabilities and integrations">
  <defs>
    <linearGradient id="cbCapHub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="cbCapLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.55"/>
    </linearGradient>
    <style>
      .cb-cap-flow { stroke-dasharray:8 6; animation: cbCapFlow 1.2s linear infinite; }
      @keyframes cbCapFlow { to { stroke-dashoffset:-28; } }
      .cb-cap-pulse { animation: cbCapPulse 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes cbCapPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
      .cb-cap-float { animation: cbCapFloat 4s ease-in-out infinite; }
      .cb-cap-float.f2 { animation-delay:-1.3s; }
      .cb-cap-float.f3 { animation-delay:-2.6s; }
      @keyframes cbCapFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    </style>
  </defs>
  <rect width="640" height="400" rx="18" fill="#FAFAFF" stroke="#E9D5FF"/>

  <path class="cb-cap-flow" d="M320 200 L120 90" fill="none" stroke="url(#cbCapLine)" stroke-width="2"/>
  <path class="cb-cap-flow" d="M320 200 L520 90" fill="none" stroke="url(#cbCapLine)" stroke-width="2"/>
  <path class="cb-cap-flow" d="M320 200 L120 310" fill="none" stroke="url(#cbCapLine)" stroke-width="2"/>
  <path class="cb-cap-flow" d="M320 200 L520 310" fill="none" stroke="url(#cbCapLine)" stroke-width="2"/>

  <g class="cb-cap-float">
    <rect x="52" y="52" width="136" height="76" rx="14" fill="white" stroke="#C4B5FD"/>
    <text x="120" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#6D28D9" font-family="Inter,Arial,sans-serif">Web widget</text>
    <text x="120" y="102" text-anchor="middle" font-size="9" fill="#64748B" font-family="Inter,Arial,sans-serif">Live site chat</text>
  </g>
  <g class="cb-cap-float f2">
    <rect x="452" y="52" width="136" height="76" rx="14" fill="white" stroke="#86EFAC"/>
    <text x="520" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#047857" font-family="Inter,Arial,sans-serif">WhatsApp</text>
    <text x="520" y="102" text-anchor="middle" font-size="9" fill="#64748B" font-family="Inter,Arial,sans-serif">Messaging API</text>
  </g>
  <g class="cb-cap-float f3">
    <rect x="52" y="272" width="136" height="76" rx="14" fill="white" stroke="#FDBA74"/>
    <text x="120" y="302" text-anchor="middle" font-size="11" font-weight="700" fill="#C2410C" font-family="Inter,Arial,sans-serif">Document RAG</text>
    <text x="120" y="322" text-anchor="middle" font-size="9" fill="#64748B" font-family="Inter,Arial,sans-serif">PDF and FAQ index</text>
  </g>
  <g class="cb-cap-float">
    <rect x="452" y="272" width="136" height="76" rx="14" fill="white" stroke="#93C5FD"/>
    <text x="520" y="302" text-anchor="middle" font-size="11" font-weight="700" fill="#2A5F9E" font-family="Inter,Arial,sans-serif">CRM and API</text>
    <text x="520" y="322" text-anchor="middle" font-size="9" fill="#64748B" font-family="Inter,Arial,sans-serif">Tickets and webhooks</text>
  </g>

  <g class="cb-cap-pulse">
    <circle cx="320" cy="200" r="72" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="2"/>
    <circle cx="320" cy="200" r="54" fill="url(#cbCapHub)"/>
    <rect x="296" y="178" width="48" height="36" rx="10" fill="white" opacity="0.95"/>
    <path d="M308 194c0-4 3-7 7-7h10c4 0 7 3 7 7v2H308v-2z" fill="#8B5CF6"/>
    <circle cx="315" cy="191" r="2" fill="white"/><circle cx="325" cy="191" r="2" fill="white"/>
    <rect x="304" y="202" width="32" height="6" rx="3" fill="#E9D5FF"/>
  </g>

  <rect x="248" y="24" width="144" height="28" rx="14" fill="#EDE9FE"/>
  <text x="320" y="42" text-anchor="middle" font-size="10" font-weight="700" fill="#6D28D9" font-family="Inter,Arial,sans-serif">FULL CHAT STACK</text>
</svg>
