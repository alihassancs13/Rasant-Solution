<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-label="Sentra AI dashboard overview illustration">
  <defs>
    <filter id="sdSh"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4A90E2" flood-opacity="0.12"/></filter>
    <style>
      .sd-pulse{animation:sdPulse 2s ease-in-out infinite}
      @keyframes sdPulse{0%,100%{opacity:1}50%{opacity:.35}}
      .sd-flow{stroke-dasharray:6 4;animation:sdFlow 1.1s linear infinite}
      @keyframes sdFlow{to{stroke-dashoffset:-20}}
      .sd-in{opacity:0;animation:sdIn .7s ease forwards}
      .sd-in.d1{animation-delay:.1s}.sd-in.d2{animation-delay:.2s}.sd-in.d3{animation-delay:.3s}
      @keyframes sdIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    </style>
  </defs>
  <rect width="960" height="520" rx="16" fill="#F8FAFC"/>
  <rect x="0" y="0" width="80" height="520" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="40" y="28" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="11" font-weight="800" fill="#4A90E2">S</text>
  <rect x="14" y="16" width="52" height="24" rx="8" fill="#EFF6FF"/>
  <text x="24" y="52" font-family="Inter,sans-serif" font-size="8" font-weight="700" fill="#2A5F9E">Dashboard</text>
  <text x="24" y="72" font-family="Inter,sans-serif" font-size="8" fill="#64748B">Live Calls</text>
  <text x="24" y="92" font-family="Inter,sans-serif" font-size="8" fill="#64748B">Call Queue</text>
  <text x="24" y="112" font-family="Inter,sans-serif" font-size="8" fill="#64748B">Campaigns</text>
  <text x="24" y="132" font-family="Inter,sans-serif" font-size="8" fill="#64748B">Scheduler</text>
  <text x="24" y="152" font-family="Inter,sans-serif" font-size="8" fill="#64748B">Analytics</text>

  <rect x="80" y="0" width="880" height="56" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="100" y="34" font-family="Space Grotesk,sans-serif" font-size="15" font-weight="700" fill="#1E3A5F">Command Center</text>
  <rect x="780" y="16" width="72" height="24" rx="12" fill="#CCFBF1"/>
  <circle cx="794" cy="28" r="5" fill="#14B8A6" class="sd-pulse"/>
  <text x="806" y="32" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#0F766E">LIVE</text>
  <text x="868" y="32" font-family="Inter,sans-serif" font-size="10" fill="#64748B">Updated 2s ago</text>

  <g class="sd-in d1" filter="url(#sdSh)">
    <rect x="100" y="72" width="190" height="92" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="100" y="72" width="190" height="3" rx="12" fill="#4A90E2"/>
    <text x="116" y="96" font-family="Inter,sans-serif" font-size="9" font-weight="600" fill="#64748B">TOTAL CALLS</text>
    <text x="116" y="132" font-family="Space Grotesk,sans-serif" font-size="32" font-weight="800" fill="#1E3A5F">128</text>
    <text x="116" y="150" font-family="Inter,sans-serif" font-size="9" fill="#22C55E">↑ 12% vs yesterday</text>
  </g>
  <g class="sd-in d1" filter="url(#sdSh)">
    <rect x="306" y="72" width="190" height="92" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="306" y="72" width="190" height="3" rx="12" fill="#6B52B8"/>
    <text x="322" y="96" font-family="Inter,sans-serif" font-size="9" font-weight="600" fill="#64748B">SCHEDULED</text>
    <text x="322" y="132" font-family="Space Grotesk,sans-serif" font-size="32" font-weight="800" fill="#1E3A5F">24</text>
    <text x="322" y="150" font-family="Inter,sans-serif" font-size="9" fill="#64748B">8 processing now</text>
  </g>
  <g class="sd-in d2" filter="url(#sdSh)">
    <rect x="512" y="72" width="190" height="92" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="512" y="72" width="190" height="3" rx="12" fill="#14B8A6"/>
    <text x="528" y="96" font-family="Inter,sans-serif" font-size="9" font-weight="600" fill="#64748B">LIVE VOLUME</text>
    <text x="528" y="132" font-family="Space Grotesk,sans-serif" font-size="32" font-weight="800" fill="#1E3A5F">149</text>
    <text x="528" y="150" font-family="Inter,sans-serif" font-size="9" fill="#64748B">3 agents online</text>
  </g>
  <g class="sd-in d2" filter="url(#sdSh)">
    <rect x="718" y="72" width="154" height="92" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="718" y="72" width="154" height="3" rx="12" fill="#C96E3A"/>
    <text x="734" y="96" font-family="Inter,sans-serif" font-size="9" font-weight="600" fill="#64748B">CSAT</text>
    <text x="734" y="132" font-family="Space Grotesk,sans-serif" font-size="32" font-weight="800" fill="#1E3A5F">94%</text>
    <text x="734" y="150" font-family="Inter,sans-serif" font-size="9" fill="#22C55E">Above target</text>
  </g>

  <g class="sd-in d3" filter="url(#sdSh)">
    <rect x="100" y="180" width="520" height="308" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="120" y="208" font-family="Space Grotesk,sans-serif" font-size="12" font-weight="700" fill="#1E3A5F">Activity trends</text>
    <text x="120" y="224" font-family="Inter,sans-serif" font-size="9" fill="#64748B">Chatbot requests &amp; voice volume</text>
    <line x1="120" y1="440" x2="590" y2="440" stroke="#E2E8F0"/>
    <line x1="120" y1="250" x2="120" y2="440" stroke="#E2E8F0"/>
    <polyline points="120,400 170,370 220,385 270,330 320,345 370,290 420,310 470,260 520,275 570,240" fill="none" stroke="#4A90E2" stroke-width="2.5" class="sd-flow"/>
    <polyline points="120,420 170,405 220,410 270,380 320,390 370,360 420,370 470,340 520,350 570,330" fill="none" stroke="#6B52B8" stroke-width="2" opacity=".6"/>
    <text x="130" y="458" font-family="Inter,sans-serif" font-size="8" fill="#94A3B8">Mon</text>
    <text x="210" y="458" font-family="Inter,sans-serif" font-size="8" fill="#94A3B8">Tue</text>
    <text x="290" y="458" font-family="Inter,sans-serif" font-size="8" fill="#94A3B8">Wed</text>
    <text x="370" y="458" font-family="Inter,sans-serif" font-size="8" fill="#94A3B8">Thu</text>
    <text x="450" y="458" font-family="Inter,sans-serif" font-size="8" fill="#94A3B8">Fri</text>
    <text x="530" y="458" font-family="Inter,sans-serif" font-size="8" fill="#94A3B8">Sat</text>
    <rect x="440" y="196" width="8" height="8" rx="2" fill="#4A90E2"/><text x="452" y="204" font-family="Inter,sans-serif" font-size="8" fill="#64748B">Voice</text>
    <rect x="500" y="196" width="8" height="8" rx="2" fill="#6B52B8"/><text x="512" y="204" font-family="Inter,sans-serif" font-size="8" fill="#64748B">Chatbot</text>
  </g>
  <g class="sd-in d3" filter="url(#sdSh)">
    <rect x="640" y="180" width="232" height="308" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="660" y="208" font-family="Space Grotesk,sans-serif" font-size="12" font-weight="700" fill="#1E3A5F">Module usage</text>
    <circle cx="756" cy="310" r="68" fill="none" stroke="#F1F5F9" stroke-width="14"/>
    <circle cx="756" cy="310" r="68" fill="none" stroke="#4A90E2" stroke-width="14" stroke-dasharray="110 318" transform="rotate(-90 756 310)"/>
    <circle cx="756" cy="310" r="68" fill="none" stroke="#6B52B8" stroke-width="14" stroke-dasharray="75 353" stroke-dashoffset="-110" transform="rotate(-90 756 310)"/>
    <circle cx="756" cy="310" r="68" fill="none" stroke="#14B8A6" stroke-width="14" stroke-dasharray="55 373" stroke-dashoffset="-185" transform="rotate(-90 756 310)"/>
    <text x="660" y="420" font-family="Inter,sans-serif" font-size="9" fill="#64748B">Voice 42%</text>
    <text x="660" y="436" font-family="Inter,sans-serif" font-size="9" fill="#64748B">Chatbot 31%</text>
    <text x="660" y="452" font-family="Inter,sans-serif" font-size="9" fill="#64748B">Campaigns 27%</text>
  </g>

  <circle cx="48" cy="220" r="10" fill="#1877F2"/><text x="48" y="224" text-anchor="middle" font-size="7" fill="#fff" font-weight="700">f</text>
  <circle cx="48" cy="260" r="10" fill="#25D366"/><text x="48" y="264" text-anchor="middle" font-size="7" fill="#fff" font-weight="700">W</text>
  <circle cx="48" cy="300" r="10" fill="#4A90E2"/><text x="48" y="304" text-anchor="middle" font-size="7" fill="#fff" font-weight="700">@</text>
  <text x="24" y="200" font-family="Inter,sans-serif" font-size="7" fill="#64748B">APP</text>
  <text x="20" y="280" font-family="Inter,sans-serif" font-size="7" fill="#64748B">Chat</text>
  <text x="18" y="320" font-family="Inter,sans-serif" font-size="7" fill="#64748B">Web</text>
  <line x1="58" y1="220" x2="100" y2="240" stroke="#14B8A6" stroke-width="1.2" stroke-dasharray="4 3" opacity=".5" class="sd-flow"/>
  <line x1="58" y1="260" x2="100" y2="270" stroke="#14B8A6" stroke-width="1.2" stroke-dasharray="4 3" opacity=".5" class="sd-flow"/>
</svg>
