<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Orchestri SDLC workflow">
  <defs>
    <linearGradient id="ofBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F3"/>
      <stop offset="50%" stop-color="#F5F0FF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="ofLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <style>
      .of-flow { stroke-dasharray:8 6; animation:ofFlow 1.4s linear infinite; }
      @keyframes ofFlow { to { stroke-dashoffset:-28; } }
      .of-glow { animation:ofGlow 3s ease-in-out infinite; }
      @keyframes ofGlow { 0%,100%{opacity:.7} 50%{opacity:1} }
    </style>
  </defs>
  <rect width="640" height="320" rx="16" fill="url(#ofBg)" stroke="#CBD5E1"/>
  <path class="of-flow" d="M108 160 H532" fill="none" stroke="url(#ofLine)" stroke-width="2.5"/>
  <g font-family="Inter,Arial,sans-serif">
    <g class="of-glow"><rect x="24" y="118" width="88" height="84" rx="12" fill="#FFFFFF" stroke="#6366F1" stroke-width="2"/><text x="68" y="148" text-anchor="middle" font-size="10" font-weight="700" fill="#4338CA">Spec</text><text x="68" y="166" text-anchor="middle" font-size="8" fill="#64748B">LLM draft</text><text x="68" y="182" text-anchor="middle" font-size="8" fill="#14B8A6">User approve</text></g>
    <g class="of-glow"><rect x="136" y="118" width="88" height="84" rx="12" fill="#FFFFFF" stroke="#4A90E2"/><text x="180" y="148" text-anchor="middle" font-size="10" font-weight="700" fill="#2A5F9E">Plan</text><text x="180" y="166" text-anchor="middle" font-size="8" fill="#64748B">Tasks + tests</text><text x="180" y="182" text-anchor="middle" font-size="8" fill="#14B8A6">Approve</text></g>
    <g class="of-glow"><rect x="248" y="118" width="88" height="84" rx="12" fill="#FFFFFF" stroke="#14B8A6"/><text x="292" y="148" text-anchor="middle" font-size="10" font-weight="700" fill="#0F766E">Implement</text><text x="292" y="166" text-anchor="middle" font-size="8" fill="#64748B">Code agent</text><text x="292" y="182" text-anchor="middle" font-size="8" fill="#64748B">Local workspace</text></g>
    <g class="of-glow"><rect x="360" y="118" width="88" height="84" rx="12" fill="#FFFFFF" stroke="#F59E0B"/><text x="404" y="148" text-anchor="middle" font-size="10" font-weight="700" fill="#C2410C">Test loop</text><text x="404" y="166" text-anchor="middle" font-size="8" fill="#64748B">Subprocess</text><text x="404" y="182" text-anchor="middle" font-size="8" fill="#64748B">Debug agent</text></g>
    <g class="of-glow"><rect x="472" y="118" width="88" height="84" rx="12" fill="#FFFFFF" stroke="#2A5F9E" stroke-width="2"/><text x="516" y="148" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A5F">Deploy</text><text x="516" y="166" text-anchor="middle" font-size="8" fill="#64748B">Confirm</text><text x="516" y="182" text-anchor="middle" font-size="8" fill="#14B8A6">Optional run</text></g>
  </g>
  <rect x="180" y="232" width="280" height="36" rx="18" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="320" y="255" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="600" fill="#1E3A5F">Gated FSM | SSE events | FastAPI + React monorepo</text>
</svg>
