    <text x="52" y="308" font-family="Inter,sans-serif" font-size="10" fill="#1E3A5F">Visitor #4821</text>
    <text x="200" y="308" font-family="Inter,sans-serif" font-size="10" fill="#25D366">WhatsApp</text>
    <text x="360" y="308" font-family="Inter,sans-serif" font-size="10" fill="#1E3A5F">2,840</text>
