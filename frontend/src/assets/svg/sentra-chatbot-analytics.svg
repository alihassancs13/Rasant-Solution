  <rect x="440" y="76" width="72" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/><text x="452" y="92" font-family="Inter,sans-serif" font-size="10" fill="#1E3A5F">Daily</text>
  <rect x="800" y="76" width="120" height="24" rx="8" fill="#4A90E2"/><text x="860" y="92" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Apply filters</text>

