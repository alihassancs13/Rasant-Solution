    <text x="200" y="338" font-family="Inter,sans-serif" font-size="10" fill="#4A90E2">Web chat</text>
    <text x="360" y="338" font-family="Inter,sans-serif" font-size="10" fill="#1E3A5F">1,120</text>
    <text x="500" y="338" font-family="Inter,sans-serif" font-size="10" fill="#64748B">Order status</text>
    <text x="720" y="338" font-family="Inter,sans-serif" font-size="10" fill="#64748B">8 min ago</text>
    <line x1="40" y1="348" x2="920" y2="348" stroke="#F1F5F9"/>
    <text x="52" y="368" font-family="Inter,sans-serif" font-size="10" fill="#1E3A5F">Visitor #4815</text>
    <text x="200" y="368" font-family="Inter,sans-serif" font-size="10" fill="#1877F2">Messenger</text>
    <text x="360" y="368" font-family="Inter,sans-serif" font-size="10" fill="#1E3A5F">3,410</text>
    <text x="500" y="368" font-family="Inter,sans-serif" font-size="10" fill="#64748B">Returns policy</text>
    <text x="720" y="368" font-family="Inter,sans-serif" font-size="10" fill="#64748B">14 min ago</text>
