<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="Sentra AI chatbot analytics illustration">
  <defs>
    <style>
      .sa-in{opacity:0;animation:saIn .6s ease forwards}
      .sa-in.d1{animation-delay:.1s}.sa-in.d2{animation-delay:.2s}
      @keyframes saIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    </style>
  </defs>
  <rect width="960" height="400" rx="16" fill="#F8FAFC"/>
  <text x="24" y="32" font-family="Space Grotesk,sans-serif" font-size="15" font-weight="700" fill="#1E3A5F">Chatbot Analytics</text>
  <text x="24" y="50" font-family="Inter,sans-serif" font-size="10" fill="#64748B">Token usage · embeddings · request volume</text>

  <rect x="24" y="64" width="912" height="44" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="40" y="90" font-family="Inter,sans-serif" font-size="9" font-weight="600" fill="#64748B">Client</text>
  <rect x="88" y="76" width="100" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/><text x="100" y="92" font-family="Inter,sans-serif" font-size="10" fill="#1E3A5F">Acme Corp</text>
  <text x="220" y="90" font-family="Inter,sans-serif" font-size="9" font-weight="600" fill="#64748B">Period</text>
  <rect x="268" y="76" width="88" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/><text x="280" y="92" font-family="Inter,sans-serif" font-size="10" fill="#1E3A5F">Last 30d</text>
