<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" role="img" aria-label="Voice AI agent robot on a call">
  <defs>
    <linearGradient id="pShell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="pGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD5B4"/>
      <stop offset="50%" stop-color="#8FB9F4"/>
      <stop offset="100%" stop-color="#4A90E2"/>
    </linearGradient>
    <filter id="pShadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4A90E2" flood-opacity="0.2"/>
    </filter>
    <style>
      .p-ring { animation: pRing 9s linear infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pRing { to { transform: rotate(360deg); } }
      .p-pulse { animation: pPulse 2s ease-in-out infinite; }
      @keyframes pPulse { 0%,100%{opacity:.5} 50%{opacity:1} }
      .p-wave { animation: pWave 1.3s ease-in-out infinite; }
      .p-wave2 { animation: pWave 1.3s ease-in-out infinite .35s; }
      .p-wave3 { animation: pWave 1.3s ease-in-out infinite .7s; }
      @keyframes pWave { 0%,100%{opacity:.3;transform:scale(.92)} 50%{opacity:1;transform:scale(1.04)} }
      .p-phone { animation: pPhoneTilt 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 238px 228px; }
      @keyframes pPhoneTilt { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(7deg)} }
      .p-bar { animation: pBar 1s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
      .p-bar.b2 { animation-delay: .18s; }
      .p-bar.b3 { animation-delay: .36s; }
      .p-bar.b4 { animation-delay: .54s; }
      @keyframes pBar { 0%,100%{transform:scaleY(.5)} 50%{transform:scaleY(1)} }
    </style>
  </defs>

  <ellipse cx="148" cy="334" rx="88" ry="10" fill="#4A90E2" opacity="0.12" class="p-pulse"/>
  <circle class="p-ring" cx="148" cy="168" r="118" fill="none" stroke="url(#pGlow)" stroke-width="2" stroke-dasharray="7 9" opacity="0.35"/>

  <g filter="url(#pShadow)">
    <!-- robot bust -->
    <line x1="148" y1="28" x2="148" y2="50" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <circle class="p-pulse" cx="148" cy="22" r="7" fill="#4A90E2"/>

    <rect x="82" y="50" width="132" height="104" rx="28" fill="url(#pShell)" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="98" y="68" width="100" height="68" rx="16" fill="#1E3A5F"/>
    <circle cx="124" cy="96" r="9" fill="#14B8A6"/>
    <circle cx="127" cy="93" r="3" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="172" cy="96" r="9" fill="#14B8A6"/>
    <circle cx="175" cy="93" r="3" fill="#FFFFFF" opacity="0.85"/>
    <rect class="p-bar" x="112" y="110" width="4" height="12" rx="2" fill="#4A90E2"/>
    <rect class="p-bar b2" x="120" y="106" width="4" height="16" rx="2" fill="#6B52B8"/>
    <rect class="p-bar b3" x="128" y="108" width="4" height="14" rx="2" fill="#4A90E2"/>
    <rect class="p-bar b4" x="136" y="104" width="4" height="18" rx="2" fill="#14B8A6"/>
    <rect class="p-bar b3" x="144" y="108" width="4" height="14" rx="2" fill="#4A90E2"/>
    <rect class="p-bar b2" x="152" y="106" width="4" height="16" rx="2" fill="#6B52B8"/>
    <rect class="p-bar" x="160" y="110" width="4" height="12" rx="2" fill="#4A90E2"/>

    <rect x="70" y="82" width="12" height="38" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
    <rect x="214" y="82" width="12" height="38" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>

    <rect x="108" y="154" width="80" height="118" rx="26" fill="url(#pShell)" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="148" cy="210" r="30" fill="#F8FAFC" stroke="#4A90E2" stroke-width="2"/>
    <circle cx="148" cy="210" r="12" fill="#4A90E2"/>
    <circle cx="148" cy="210" r="5" fill="#FFFFFF" opacity="0.9"/>

    <rect x="52" y="168" width="30" height="78" rx="15" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="67" cy="256" r="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="214" y="168" width="30" height="78" rx="15" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="229" cy="256" r="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  </g>

  <!-- phone + waves -->
  <g class="p-phone">
    <rect x="224" y="196" width="24" height="50" rx="11" fill="#CBD5E1" transform="rotate(14 236 221)"/>
    <rect x="238" y="168" width="42" height="68" rx="12" fill="#1E3A5F" stroke="#4A90E2" stroke-width="2"/>
    <rect x="244" y="176" width="30" height="46" rx="6" fill="#2A5F9E" opacity="0.35"/>
    <circle cx="258" cy="230" r="4.5" fill="#4A90E2"/>
    <path class="p-wave" d="M284 178c7 5 11 13 11 20s-4 15-11 20" fill="none" stroke="#4A90E2" stroke-width="2.5" stroke-linecap="round"/>
    <path class="p-wave2" d="M292 170c11 9 17 20 17 31s-6 22-17 31" fill="none" stroke="#6B52B8" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path class="p-wave3" d="M300 162c14 12 22 28 22 44s-8 32-22 44" fill="none" stroke="#14B8A6" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  </g>

  <g opacity="0.96">
    <rect x="12" y="12" width="96" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="30" cy="28" r="5" fill="#22C55E" class="p-pulse"/>
    <text x="42" y="32" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#059669">ON CALL</text>
    <rect x="204" y="12" width="96" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="252" y="32" text-anchor="middle" font-family="Space Grotesk,Arial,sans-serif" font-size="11" font-weight="800" fill="#1E3A5F">Voice AI</text>
  </g>
</svg>
