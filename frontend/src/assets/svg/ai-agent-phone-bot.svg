<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="4 8 292 328" role="img" aria-label="Voice AI agent with phone">
  <defs>
    <linearGradient id="pGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD5B4"/>
      <stop offset="50%" stop-color="#8FB9F4"/>
      <stop offset="100%" stop-color="#2A5F9E"/>
    </linearGradient>
    <filter id="pShadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4A90E2" flood-opacity="0.22"/>
    </filter>
    <style>
      .p-ring { animation: pRing 8s linear infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pRing { to{transform:rotate(360deg)} }
      .p-pulse { animation: pPulse 2s ease-in-out infinite; }
      @keyframes pPulse { 0%,100%{opacity:.45} 50%{opacity:1} }
      .p-wave { animation: pWave 1.4s ease-in-out infinite; }
      .p-wave2 { animation: pWave 1.4s ease-in-out infinite .35s; }
      .p-wave3 { animation: pWave 1.4s ease-in-out infinite .7s; }
      @keyframes pWave { 0%,100%{opacity:.25;transform:scale(.9)} 50%{opacity:.95;transform:scale(1.05)} }
      .p-phone { animation: pPhoneTilt 3s ease-in-out infinite; transform-box: fill-box; transform-origin: 218px 210px; }
      @keyframes pPhoneTilt { 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(6deg)} }
    </style>
  </defs>

  <ellipse cx="138" cy="168" rx="108" ry="120" fill="#4A90E2" opacity="0.07"/>
  <ellipse cx="138" cy="308" rx="72" ry="10" fill="#4A90E2" opacity="0.12" class="p-pulse"/>

  <circle class="p-ring" cx="138" cy="158" r="108" fill="none" stroke="url(#pGlow)" stroke-width="2" stroke-dasharray="8 10" opacity="0.38"/>

  <g filter="url(#pShadow)">
    <image href="../images/ai-agent-face.png" x="44" y="40" width="136" height="172" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g class="p-phone">
    <rect x="206" y="188" width="26" height="54" rx="12" fill="#CBD5E1" transform="rotate(16 219 215)"/>
    <rect x="224" y="158" width="44" height="72" rx="12" fill="#1E293B" stroke="#4A90E2" stroke-width="2"/>
    <rect x="230" y="166" width="32" height="48" rx="6" fill="#2A5F9E" opacity="0.35"/>
    <circle cx="246" cy="222" r="5" fill="#4A90E2"/>
    <path class="p-wave" d="M272 178c8 6 12 14 12 22s-4 16-12 22" fill="none" stroke="#4A90E2" stroke-width="2.5" stroke-linecap="round"/>
    <path class="p-wave2" d="M280 170c12 10 18 22 18 34s-6 24-18 34" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path class="p-wave3" d="M288 162c16 14 24 32 24 50s-8 36-24 50" fill="none" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <g opacity="0.95">
    <rect x="16" y="18" width="96" height="34" rx="17" fill="white" stroke="#E2E8F0"/>
    <circle cx="34" cy="35" r="5" fill="#34D399" class="p-pulse"/>
    <text x="46" y="39" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#059669">ON CALL</text>
    <rect x="180" y="18" width="96" height="34" rx="17" fill="white" stroke="#E2E8F0"/>
    <text x="228" y="39" text-anchor="middle" font-family="Space Grotesk,Arial,sans-serif" font-size="11" font-weight="800" fill="#2A5F9E">Voice AI</text>
  </g>
</svg>
