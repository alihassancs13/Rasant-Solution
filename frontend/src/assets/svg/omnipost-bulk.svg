<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="OmniPost bulk CSV upload">
  <defs>
    <filter id="opbSh"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7C3AED" flood-opacity="0.12"/></filter>
    <linearGradient id="opbGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#EC4899"/></linearGradient>
    <style>
      .opb-pulse{animation:opbPulse 2s ease-in-out infinite}
      @keyframes opbPulse{0%,100%{opacity:1}50%{opacity:.5}}
    </style>
  </defs>
  <rect width="960" height="480" rx="16" fill="#FAFAFE"/>

  <g filter="url(#opbSh)">
    <rect x="40" y="40" width="520" height="400" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="40" y="40" width="520" height="44" rx="14" fill="#ECFDF5"/>
    <circle cx="68" cy="62" r="12" fill="#10B981"/>
    <path d="M64,62l3,3 6-6" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <text x="88" y="66" font-family="Space Grotesk,sans-serif" font-size="13" font-weight="800" fill="#065F46">Bulk Create Posts</text>

    <rect x="60" y="100" width="480" height="120" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="8 5"/>
    <text x="300" y="148" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="600" fill="#64748B">Drop CSV here or click to upload</text>
    <text x="300" y="168" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#94A3B8">Accepts .csv  |  topic, platform, tone, hashtags columns</text>
    <rect x="240" y="180" width="120" height="28" rx="8" fill="#FFFFFF" stroke="#7C3AED"/>
    <text x="300" y="198" text-anchor="middle" font-size="9" font-weight="600" fill="#7C3AED">Browse files</text>

    <text x="60" y="248" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#64748B">CAMPAIGN (OPTIONAL)</text>
    <rect x="60" y="256" width="280" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="72" y="276" font-size="10" fill="#1E293B">Summer 2026 Launch</text>
    <rect x="360" y="256" width="180" height="32" rx="8" fill="url(#opbGrad)"/>
    <text x="450" y="276" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Upload &amp; Process</text>

    <text x="60" y="316" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#64748B">IMPORT PREVIEW</text>
    <rect x="60" y="324" width="480" height="100" rx="8" fill="#0F172A"/>
    <text x="72" y="344" font-family="monospace" font-size="8" fill="#94A3B8">topic,platform,tone,hashtags</text>
    <text x="72" y="360" font-family="monospace" font-size="8" fill="#818CF8">Summer launch,linkedin,professional,#OmniPost</text>
    <text x="72" y="376" font-family="monospace" font-size="8" fill="#E2E8F0">Product tips,facebook,friendly,#Tips</text>
    <text x="72" y="392" font-family="monospace" font-size="8" fill="#E2E8F0">Weekly roundup,twitter,bold,#Weekly</text>
    <text x="72" y="412" font-family="Inter,sans-serif" font-size="8" fill="#10B981" class="opb-pulse">OK 48 rows validated  |  ready to generate</text>
  </g>

  <g filter="url(#opbSh)">
    <rect x="580" y="40" width="340" height="400" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="600" y="72" font-family="Space Grotesk,sans-serif" font-size="12" font-weight="700" fill="#312E81">Bulk generation progress</text>
    <rect x="600" y="88" width="300" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="600" y="88" width="228" height="8" rx="4" fill="url(#opbGrad)"/>
    <text x="600" y="112" font-size="9" fill="#64748B">36 / 48 posts generated</text>

    <rect x="600" y="132" width="300" height="48" rx="8" fill="#F0FDF4" stroke="#10B981"/>
    <text x="612" y="152" font-size="9" font-weight="600" fill="#059669">OK Summer launch  |  LinkedIn</text>
    <text x="612" y="168" font-size="8" fill="#64748B">Generated  |  sent to approval queue</text>
    <rect x="600" y="188" width="300" height="48" rx="8" fill="#F0FDF4" stroke="#10B981"/>
    <text x="612" y="208" font-size="9" font-weight="600" fill="#059669">OK Product tips  |  Facebook</text>
    <text x="612" y="224" font-size="8" fill="#64748B">Generated  |  sent to approval queue</text>
    <rect x="600" y="244" width="300" height="48" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="612" y="264" font-size="9" font-weight="600" fill="#7C3AED">⟳ Weekly roundup  |  Twitter</text>
    <text x="612" y="280" font-size="8" fill="#64748B">Generating copy...</text>
    <rect x="600" y="300" width="300" height="48" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="612" y="320" font-size="9" fill="#94A3B8">12 rows queued</text>
    <text x="612" y="336" font-size="8" fill="#94A3B8">Waiting for batch slot</text>

    <rect x="600" y="368" width="140" height="56" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="612" y="388" font-size="8" fill="#64748B">Campaign</text>
    <text x="612" y="408" font-family="Space Grotesk,sans-serif" font-size="16" font-weight="800" fill="#312E81">Summer 2026</text>
    <rect x="760" y="368" width="140" height="56" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="772" y="388" font-size="8" fill="#64748B">Est. time</text>
    <text x="772" y="408" font-family="Space Grotesk,sans-serif" font-size="16" font-weight="800" fill="#7C3AED">~4 min</text>
  </g>
</svg>
