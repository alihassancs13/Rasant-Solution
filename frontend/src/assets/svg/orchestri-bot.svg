<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -28 320 380" role="img" aria-label="Orchestri orchestrator mascot">
  <defs>
    <linearGradient id="ocGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A5F9E"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="ocRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD5B4"/>
      <stop offset="50%" stop-color="#C9C4F8"/>
      <stop offset="100%" stop-color="#8FB9F4"/>
    </linearGradient>
    <filter id="ocShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4338CA" flood-opacity="0.22"/>
    </filter>
    <style>
      .oc-float { animation: ocFloat 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes ocFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
      .oc-orbit { animation: ocOrbit 12s linear infinite; transform-box: fill-box; transform-origin: 160px 178px; }
      @keyframes ocOrbit { to{transform:rotate(360deg)} }
      .oc-pulse { animation: ocPulse 2s ease-in-out infinite; }
      @keyframes ocPulse { 0%,100%{opacity:.45} 50%{opacity:1} }
      .oc-line{stroke-dasharray:5 4;animation:ocLine 1.1s linear infinite}
      @keyframes ocLine{to{stroke-dashoffset:-18}}
    </style>
  </defs>
  <ellipse cx="160" cy="318" rx="78" ry="12" fill="#6366F1" opacity="0.14" class="oc-pulse"/>

  <!-- Orbiting stage chips -->
  <g class="oc-orbit" opacity="0.9">
    <g transform="translate(160,178)">
      <rect x="-18" y="-108" width="36" height="28" rx="8" fill="#FFF8F3" stroke="#6366F1" stroke-width="1.5" filter="url(#ocShadow)"/>
      <text x="0" y="-90" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" font-weight="700" fill="#4338CA">SPEC</text>
      <rect x="92" y="52" width="36" height="28" rx="8" fill="#EFF6FF" stroke="#4A90E2" stroke-width="1.5"/>
      <text x="110" y="70" text-anchor="middle" font-family="Inter,sans-serif" font-size="6" font-weight="700" fill="#2A5F9E">DEPLOY</text>
      <rect x="-128" y="40" width="36" height="28" rx="8" fill="#F0FDF4" stroke="#14B8A6" stroke-width="1.5"/>
      <text x="-110" y="58" text-anchor="middle" font-family="Inter,sans-serif" font-size="6" font-weight="700" fill="#0F766E">PLAN</text>
    </g>
  </g>
  <circle cx="160" cy="178" r="118" fill="none" stroke="url(#ocRing)" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.45" class="oc-pulse"/>

  <!-- Main bot body -->
  <g class="oc-float" filter="url(#ocShadow)">
    <circle cx="160" cy="178" r="68" fill="url(#ocGrad)"/>
    <circle cx="160" cy="178" r="60" fill="none" stroke="white" stroke-width="2" opacity="0.2"/>
    <g transform="translate(160,166)">
      <rect x="-38" y="-36" width="76" height="56" rx="16" fill="white" opacity="0.96"/>
      <text x="0" y="-14" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="13" font-weight="800" fill="#1E3A5F">OC</text>
      <path d="M-26 4h52M-26 16h34M-26 28h44" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
      <circle cx="22" cy="10" r="5" fill="#14B8A6" class="oc-pulse"/>
    </g>
    <circle cx="206" cy="132" r="12" fill="#14B8A6" stroke="white" stroke-width="2.5"/>
    <text x="206" y="136" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="10" font-weight="800" fill="white">AI</text>
  </g>

  <!-- Top status badges -->
  <g opacity="0.96">
    <rect x="18" y="18" width="108" height="36" rx="18" fill="white" stroke="#E2E8F0" filter="url(#ocShadow)"/>
    <circle cx="36" cy="36" r="6" fill="#14B8A6" class="oc-pulse"/>
    <text x="48" y="40" font-family="Inter,sans-serif" font-size="10" font-weight="700" fill="#0F766E">FSM LIVE</text>
    <rect x="186" y="18" width="108" height="36" rx="18" fill="white" stroke="#E2E8F0" filter="url(#ocShadow)"/>
    <text x="240" y="40" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="12" font-weight="800" fill="#4338CA">4 agents</text>
  </g>

  <!-- Mini pipeline preview -->
  <rect x="48" y="268" width="224" height="36" rx="10" fill="white" stroke="#E2E8F0" opacity="0.95"/>
  <rect x="60" y="284" width="180" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="60" y="284" width="108" height="4" rx="2" fill="#14B8A6"/>
  <circle cx="68" cy="286" r="5" fill="#6366F1"/><circle cx="108" cy="286" r="5" fill="#6366F1"/>
  <circle cx="148" cy="286" r="6" fill="#14B8A6" class="oc-pulse"/><circle cx="188" cy="286" r="5" fill="#E2E8F0"/>
  <text x="160" y="300" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" fill="#64748B">Implementing · 62%</text>
</svg>
