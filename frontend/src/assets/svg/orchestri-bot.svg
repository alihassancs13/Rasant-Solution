<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -28 280 348" role="img" aria-label="Orchestri orchestrator mascot">
  <defs>
    <linearGradient id="ocGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A5F9E"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="ocRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD5B4"/>
      <stop offset="50%" stop-color="#C9C4F8"/>
      <stop offset="100%" stop-color="#8FB9F4"/>
    </linearGradient>
    <filter id="ocShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4338CA" flood-opacity="0.22"/>
    </filter>
    <style>
      .oc-float { animation: ocFloat 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes ocFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
      .oc-orbit { animation: ocOrbit 12s linear infinite; transform-box: fill-box; transform-origin: 140px 168px; }
      @keyframes ocOrbit { to{transform:rotate(360deg)} }
      .oc-pulse { animation: ocPulse 2s ease-in-out infinite; }
      @keyframes ocPulse { 0%,100%{opacity:.45} 50%{opacity:1} }
    </style>
  </defs>
  <ellipse cx="140" cy="298" rx="68" ry="11" fill="#6366F1" opacity="0.14" class="oc-pulse"/>
  <g class="oc-orbit" opacity="0.85">
    <g transform="translate(140,168)">
      <rect x="-12" y="-98" width="24" height="24" rx="6" fill="#FFF8F3" stroke="#6366F1" stroke-width="1.5"/>
      <text x="0" y="-82" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="7" font-weight="700" fill="#4338CA">SPEC</text>
      <circle cx="85" cy="48" r="12" fill="#EFF6FF" stroke="#4A90E2" stroke-width="1.5"/>
      <text x="85" y="51" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="6" font-weight="700" fill="#2A5F9E">DEPLOY</text>
    </g>
  </g>
  <circle cx="140" cy="168" r="108" fill="none" stroke="url(#ocRing)" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" class="oc-pulse"/>
  <g class="oc-float" filter="url(#ocShadow)">
    <circle cx="140" cy="168" r="62" fill="url(#ocGrad)"/>
    <circle cx="140" cy="168" r="54" fill="none" stroke="white" stroke-width="2" opacity="0.2"/>
    <g transform="translate(140,158)">
      <rect x="-34" y="-32" width="68" height="52" rx="14" fill="white" opacity="0.95"/>
      <text x="0" y="-12" text-anchor="middle" font-family="Space Grotesk,Arial,sans-serif" font-size="11" font-weight="800" fill="#1E3A5F">OC</text>
      <path d="M-22 2h44M-22 12h28M-22 22h36" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
      <circle cx="18" cy="8" r="4" fill="#14B8A6"/>
    </g>
    <circle cx="182" cy="126" r="10" fill="#14B8A6" stroke="white" stroke-width="2.5"/>
    <text x="182" y="130" text-anchor="middle" font-family="Space Grotesk,Arial,sans-serif" font-size="9" font-weight="800" fill="white">AI</text>
  </g>
  <g opacity="0.95">
    <rect x="22" y="22" width="92" height="32" rx="16" fill="white" stroke="#E2E8F0"/>
    <circle cx="38" cy="38" r="5" fill="#14B8A6" class="oc-pulse"/>
    <text x="50" y="42" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#0F766E">FSM LIVE</text>
    <rect x="166" y="22" width="92" height="32" rx="16" fill="white" stroke="#E2E8F0"/>
    <text x="212" y="42" text-anchor="middle" font-family="Space Grotesk,Arial,sans-serif" font-size="11" font-weight="800" fill="#4338CA">3 agents</text>
  </g>
</svg>
