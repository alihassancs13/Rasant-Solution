<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="44 20 552 332" role="img" aria-label="Voice AI agent capabilities and telephony integrations">
  <defs>
    <linearGradient id="aaCapLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8FB9F4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2A5F9E" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="aaCapFaceClip"><circle cx="320" cy="200" r="54"/></clipPath>
    <style>
      .aa-cap-flow { stroke-dasharray:8 6; animation: aaCapFlow 1.2s linear infinite; }
      @keyframes aaCapFlow { to { stroke-dashoffset:-28; } }
      .aa-cap-pulse { animation: aaCapPulse 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes aaCapPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
    </style>
  </defs>

  <ellipse cx="320" cy="200" rx="220" ry="130" fill="#4A90E2" opacity="0.05"/>

  <path class="aa-cap-flow" d="M320 200 L120 90" fill="none" stroke="url(#aaCapLine)" stroke-width="2"/>
  <path class="aa-cap-flow" d="M320 200 L520 90" fill="none" stroke="url(#aaCapLine)" stroke-width="2"/>
  <path class="aa-cap-flow" d="M320 200 L120 310" fill="none" stroke="url(#aaCapLine)" stroke-width="2"/>
  <path class="aa-cap-flow" d="M320 200 L520 310" fill="none" stroke="url(#aaCapLine)" stroke-width="2"/>

  <g>
    <rect x="52" y="52" width="136" height="76" rx="14" fill="white" stroke="#7DD3FC"/>
