    <text x="120" y="102" text-anchor="middle" font-size="9" fill="#64748B" font-family="Inter,Arial,sans-serif">Live transcription</text>
  </g>
  <g>
    <rect x="452" y="52" width="136" height="76" rx="14" fill="white" stroke="#93C5FD"/>
    <text x="520" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#2A5F9E" font-family="Inter,Arial,sans-serif">Text-to-speech</text>
    <text x="520" y="102" text-anchor="middle" font-size="9" fill="#64748B" font-family="Inter,Arial,sans-serif">Natural voice</text>
  </g>
  <g>
    <rect x="52" y="272" width="136" height="76" rx="14" fill="white" stroke="#FDBA74"/>
    <text x="120" y="302" text-anchor="middle" font-size="11" font-weight="700" fill="#C2410C" font-family="Inter,Arial,sans-serif">Call queue</text>
    <text x="120" y="322" text-anchor="middle" font-size="9" fill="#64748B" font-family="Inter,Arial,sans-serif">Live scheduling</text>
  </g>
  <g>
    <rect x="452" y="272" width="136" height="76" rx="14" fill="white" stroke="#86EFAC"/>
    <text x="520" y="302" text-anchor="middle" font-size="11" font-weight="700" fill="#047857" font-family="Inter,Arial,sans-serif">CRM and PBX</text>
