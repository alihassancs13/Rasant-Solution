      <rect x="304" y="197" width="4" height="14" rx="2" fill="#6B52B8"/>
      <rect x="312" y="199" width="4" height="12" rx="2" fill="#4A90E2"/>
      <rect x="320" y="195" width="4" height="16" rx="2" fill="#14B8A6"/>
      <rect x="328" y="199" width="4" height="12" rx="2" fill="#4A90E2"/>
      <rect x="336" y="197" width="4" height="14" rx="2" fill="#6B52B8"/>
      <line x1="320" y1="142" x2="320" y2="154" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="320" cy="138" r="5.5" fill="#4A90E2"/>
      <rect x="262" y="176" width="10" height="32" rx="5" fill="#F1F5F9" stroke="#E2E8F0"/>
      <rect x="368" y="176" width="10" height="32" rx="5" fill="#F1F5F9" stroke="#E2E8F0"/>
      <rect x="288" y="236" width="64" height="52" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
      <circle cx="320" cy="262" r="18" fill="#F8FAFC" stroke="#4A90E2" stroke-width="1.5"/>
