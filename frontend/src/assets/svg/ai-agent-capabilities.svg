  <rect x="248" y="24" width="144" height="28" rx="14" fill="#EFF6FF"/>
  <text x="320" y="42" text-anchor="middle" font-size="10" font-weight="700" fill="#2A5F9E" font-family="Inter,Arial,sans-serif">VOICE AGENT STACK</text>
