<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Voice AI agent capabilities and telephony integrations">
  <defs>
    <linearGradient id="aaCapHub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#4A90E2"/>
    </linearGradient>
    <linearGradient id="aaCapLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4A90E2" stop-opacity="0.55"/>
    </linearGradient>
    <style>
      .aa-cap-flow { stroke-dasharray:8 6; animation: aaCapFlow 1.2s linear infinite; }
      @keyframes aaCapFlow { to { stroke-dashoffset:-28; } }
      .aa-cap-pulse { animation: aaCapPulse 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes aaCapPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
      .aa-cap-float { animation: aaCapFloat 4s ease-in-out infinite; }
      .aa-cap-float.f2 { animation-delay:-1.3s; }
      .aa-cap-float.f3 { animation-delay:-2.6s; }
      @keyframes aaCapFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
      .aa-cap-wave { animation: aaCapWave 1.8s ease-in-out infinite; }
      @keyframes aaCapWave { 0%,100%{opacity:.5} 50%{opacity:1} }
    </style>
  </defs>
  <rect width="640" height="400" rx="18" fill="#F0FDFA" stroke="#99F6E4"/>

  <path class="aa-cap-flow" d="M320 205 L115 95" fill="none" stroke="url(#aaCapLine)" stroke-width="2"/>
  <path class="aa-cap-flow" d="M320 205 L525 95" fill="none" stroke="url(#aaCapLine)" stroke-width="2"/>
  <path class="aa-cap-flow" d="M320 205 L115 315" fill="none" stroke="url(#aaCapLine)" stroke-width="2"/>
  <path class="aa-cap-flow" d="M320 205 L525 315" fill="none" stroke="url(#aaCapLine)" stroke-width="2"/>

  <g class="aa-cap-float">
    <rect x="48" y="52" width="134" height="76" rx="14" fill="white" stroke="#5EEAD4"/>
    <text x="115" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#0F766E" font-family="Inter,Arial,sans-serif">Speech-to-text</text>
    <text x="115" y="102" text-anchor="middle" font-size="9" fill="#64748B" font-family="Inter,Arial,sans-serif">Live transcription</text>
  </g>
  <g class="aa-cap-float f2">
    <rect x="458" y="52" width="134" height="76" rx="14" fill="white" stroke="#7DD3FC"/>
    <text x="525" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#2A5F9E" font-family="Inter,Arial,sans-serif">Text-to-speech</text>
    <text x="525" y="102" text-anchor="middle" font-size="9" fill="#64748B" font-family="Inter,Arial,sans-serif">Natural voice</text>
  </g>
  <g class="aa-cap-float f3">
    <rect x="48" y="272" width="134" height="76" rx="14" fill="white" stroke="#93C5FD"/>
    <text x="115" y="302" text-anchor="middle" font-size="11" font-weight="700" fill="#2A5F9E" font-family="Inter,Arial,sans-serif">Call queue</text>
    <text x="115" y="322" text-anchor="middle" font-size="9" fill="#64748B" font-family="Inter,Arial,sans-serif">Live scheduling</text>
  </g>
  <g class="aa-cap-float">
    <rect x="458" y="272" width="134" height="76" rx="14" fill="white" stroke="#FDBA74"/>
    <text x="525" y="302" text-anchor="middle" font-size="11" font-weight="700" fill="#C2410C" font-family="Inter,Arial,sans-serif">CRM and PBX</text>
    <text x="525" y="322" text-anchor="middle" font-size="9" fill="#64748B" font-family="Inter,Arial,sans-serif">Telephony hooks</text>
  </g>

  <g class="aa-cap-pulse">
    <circle cx="320" cy="205" r="72" fill="#CCFBF1" stroke="#99F6E4" stroke-width="2"/>
    <circle cx="320" cy="205" r="54" fill="url(#aaCapHub)"/>
    <rect x="292" y="178" width="56" height="54" rx="12" fill="white" opacity="0.95"/>
    <path d="M304 218c0-8 7-14 16-14s16 6 16 14" fill="none" stroke="#4A90E2" stroke-width="3"/>
    <rect x="312" y="188" width="16" height="24" rx="6" fill="#4A90E2"/>
    <g class="aa-cap-wave">
      <path d="M298 228h8v4h-8z M306 226h8v8h-8z M314 224h8v12h-8z M322 226h8v8h-8z M330 228h8v4h-8z" fill="#14B8A6"/>
    </g>
  </g>

  <rect x="238" y="24" width="164" height="28" rx="14" fill="#CCFBF1"/>
  <text x="320" y="42" text-anchor="middle" font-size="10" font-weight="700" fill="#0F766E" font-family="Inter,Arial,sans-serif">VOICE AGENT STACK</text>
</svg>
