<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 150" role="img" aria-label="Scheduled calls overview">
  <defs>
    <style>
      .sc-live { animation: scLive 1.8s ease-in-out infinite; }
      @keyframes scLive { 0%,100%{opacity:1} 50%{opacity:.35} }
      .sc-in { opacity:0; animation: scIn .7s ease forwards; }
      .sc-in.d1{animation-delay:.08s}.sc-in.d2{animation-delay:.16s}.sc-in.d3{animation-delay:.24s}
      @keyframes scIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
    </style>
  </defs>
  <rect width="960" height="150" rx="14" fill="white" stroke="#E2E8F0"/>
  <rect x="20" y="18" width="36" height="36" rx="10" fill="#2DD4BF"/>
  <path d="M30 38c0-5 4-9 9-9s9 4 9 9" fill="none" stroke="white" stroke-width="2"/>
  <path d="M28 38h22M39 30v4M33 34l3 3 6-6" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <text x="68" y="36" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#1E3A5F">Scheduled Calls Overview</text>
  <text x="68" y="54" font-family="Inter,Arial,sans-serif" font-size="10" fill="#64748B">Live snapshot of your call queue - refreshes automatically</text>
  <rect x="868" y="22" width="72" height="26" rx="13" fill="#CCFBF1"/>
  <circle cx="882" cy="35" r="5" fill="#34D399" class="sc-live"/>
  <text x="896" y="39" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#0F766E">LIVE</text>
  <line x1="20" y1="68" x2="940" y2="68" stroke="#F1F5F9"/>

  <g class="sc-in d1">
    <path d="M36 98v6M40 94v14M44 98v6" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    <text x="68" y="94" font-size="9" font-weight="600" fill="#94A3B8" letter-spacing=".6" font-family="Inter,Arial,sans-serif">TOTAL CALLS</text>
    <text x="68" y="126" font-size="34" font-weight="800" fill="#1E3A5F" font-family="Space Grotesk,Arial,sans-serif">12</text>
  </g>
  <line x1="200" y1="78" x2="200" y2="138" stroke="#F1F5F9"/>

  <g class="sc-in d1">
    <rect x="168" y="88" width="28" height="28" rx="8" fill="#CCFBF1"/>
    <text x="232" y="94" font-size="9" font-weight="600" fill="#94A3B8" font-family="Inter,Arial,sans-serif">SCHEDULED CALLS</text>
    <text x="232" y="126" font-size="34" font-weight="800" fill="#1E3A5F" font-family="Space Grotesk,Arial,sans-serif">1</text>
  </g>
  <line x1="380" y1="78" x2="380" y2="138" stroke="#F1F5F9"/>

  <g class="sc-in d2">
    <rect x="392" y="74" width="220" height="72" rx="12" fill="#F5F3FF"/>
    <circle cx="412" cy="108" r="14" fill="#EDE9FE"/>
    <path d="M407 108l3 3 6-6" stroke="#7C3AED" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="436" y="94" font-size="9" font-weight="600" fill="#94A3B8" font-family="Inter,Arial,sans-serif">COMPLETED / REMAINING</text>
    <text x="436" y="124" font-family="Space Grotesk,Arial,sans-serif" font-size="32" font-weight="800">
      <tspan fill="#7C3AED">1</tspan><tspan fill="#94A3B8" font-size="22"> / </tspan><tspan fill="#1E3A5F">11</tspan>
    </text>
    <text x="436" y="138" font-size="8" fill="#94A3B8" font-family="Inter,Arial,sans-serif">DONE</text>
    <text x="500" y="138" font-size="8" fill="#94A3B8" font-family="Inter,Arial,sans-serif">LEFT</text>
    <text x="502" y="138" text-anchor="middle" font-size="8" fill="#94A3B8" font-family="Inter,Arial,sans-serif">Today 0/2 - 2 left today</text>
  </g>
  <line x1="630" y1="78" x2="630" y2="138" stroke="#F1F5F9"/>

  <g class="sc-in d3">
    <circle cx="656" cy="104" r="12" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="680" y="94" font-size="9" font-weight="600" fill="#94A3B8" font-family="Inter,Arial,sans-serif">PROCESSING</text>
    <text x="680" y="126" font-size="34" font-weight="800" fill="#1E3A5F" font-family="Space Grotesk,Arial,sans-serif">0</text>
  </g>
  <line x1="800" y1="78" x2="800" y2="138" stroke="#F1F5F9"/>

  <g class="sc-in d3">
    <circle cx="826" cy="104" r="12" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="820" y1="98" x2="832" y2="110" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="850" y="94" font-size="9" font-weight="600" fill="#94A3B8" font-family="Inter,Arial,sans-serif">BLOCKED</text>
    <text x="850" y="126" font-size="34" font-weight="800" fill="#1E3A5F" font-family="Space Grotesk,Arial,sans-serif">0</text>
  </g>
</svg>
