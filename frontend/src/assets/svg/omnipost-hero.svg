<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" role="img" aria-label="OmniPost social publishing hub">
  <defs>
    <linearGradient id="opGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="opRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="opShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#7C3AED" flood-opacity="0.25"/>
    </filter>
    <style>
      .op-float { animation: opFloat 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes opFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
      .op-orbit { animation: opOrbit 18s linear infinite; transform-box: fill-box; transform-origin: 180px 190px; }
      @keyframes opOrbit { to{transform:rotate(360deg)} }
      .op-pulse { animation: opPulse 2.2s ease-in-out infinite; }
      @keyframes opPulse { 0%,100%{opacity:.5} 50%{opacity:1} }
    </style>
  </defs>
  <ellipse cx="180" cy="340" rx="72" ry="12" fill="#7C3AED" opacity="0.12" class="op-pulse"/>
  <circle cx="180" cy="190" r="118" fill="none" stroke="url(#opRing)" stroke-width="1.5" stroke-dasharray="5 9" opacity="0.35"/>
  <g class="op-orbit" opacity="0.9">
    <g transform="translate(180,190)">
      <circle cx="0" cy="-100" r="18" fill="#1DA1F2"/>
      <path d="M-6,-104h4c2,0 3,1 3,3v6c0,2-1,3-3,3h-4" fill="white" opacity="0.9"/>
      <circle cx="95" cy="35" r="18" fill="#1877F2"/>
      <text x="95" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="white">f</text>
      <circle cx="-95" cy="35" r="18" fill="url(#opGrad)"/>
      <rect x="-103" y="27" width="16" height="16" rx="4" fill="none" stroke="white" stroke-width="2"/>
      <circle cx="-95" cy="35" r="4" fill="white"/>
    </g>
  </g>
  <g class="op-float" filter="url(#opShadow)">
    <rect x="98" y="118" width="164" height="148" rx="22" fill="url(#opGrad)"/>
    <rect x="110" y="132" width="140" height="120" rx="14" fill="white" opacity="0.96"/>
    <text x="180" y="158" text-anchor="middle" font-family="Space Grotesk,Arial,sans-serif" font-size="13" font-weight="800" fill="#5B21B6">OmniPost</text>
    <rect x="124" y="168" width="112" height="8" rx="4" fill="#EDE9FE"/>
    <rect x="124" y="184" width="88" height="8" rx="4" fill="#EDE9FE"/>
    <rect x="124" y="200" width="100" height="8" rx="4" fill="#EDE9FE"/>
    <rect x="124" y="222" width="52" height="22" rx="11" fill="#7C3AED"/>
    <text x="150" y="237" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700" fill="white">Publish</text>
    <circle cx="248" cy="148" r="14" fill="#10B981" stroke="white" stroke-width="2"/>
    <path d="M242,148l4,4 8-8" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g opacity="0.95">
    <rect x="24" y="28" width="100" height="34" rx="17" fill="white" stroke="#E2E8F0"/>
    <circle cx="40" cy="45" r="5" fill="#10B981" class="op-pulse"/>
    <text x="52" y="49" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#059669">3 platforms</text>
    <rect x="236" y="28" width="100" height="34" rx="17" fill="white" stroke="#E2E8F0"/>
    <text x="286" y="49" text-anchor="middle" font-family="Space Grotesk,Arial,sans-serif" font-size="11" font-weight="800" fill="#7C3AED">AI ready</text>
  </g>
</svg>
