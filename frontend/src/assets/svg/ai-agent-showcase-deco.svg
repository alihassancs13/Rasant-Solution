<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" preserveAspectRatio="xMidYMid slice" role="presentation" aria-hidden="true">
  <defs>
    <style>
      .aa-tile { animation: aaTilePulse 5s ease-in-out infinite; }
      .aa-t1 { animation-delay: 0s; }
      .aa-t2 { animation-delay: -1.1s; }
      .aa-t3 { animation-delay: -2.2s; }
      .aa-t4 { animation-delay: -3.3s; }
      @keyframes aaTilePulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.7; }
      }
      .aa-link { stroke-dasharray: 6 5; animation: aaLinkFlow 6s linear infinite; }
      .aa-l2 { animation-delay: -2s; }
      .aa-l3 { animation-delay: -4s; }
      @keyframes aaLinkFlow { to { stroke-dashoffset: -44; } }
    </style>
  </defs>

  <!-- Left mosaic -->
  <g>
    <rect class="aa-tile aa-t1" x="20" y="70" width="108" height="78" rx="6" fill="#CCFBF1" stroke="#99F6E4" stroke-width="1.2"/>
    <rect class="aa-tile aa-t2" x="20" y="162" width="76" height="58" rx="6" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1.2"/>
    <rect class="aa-tile aa-t3" x="100" y="158" width="90" height="90" rx="6" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.2"/>
    <rect class="aa-tile aa-t4" x="20" y="232" width="124" height="66" rx="6" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.2"/>
    <rect class="aa-tile aa-t2" x="148" y="68" width="68" height="74" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>
    <rect class="aa-tile aa-t1" x="148" y="258" width="74" height="54" rx="6" fill="#E0F2FE" stroke="#93C5FD" stroke-width="1.2"/>

    <path class="aa-link" d="M128 109 L152 197 L76 191" fill="none" stroke="#5EEAD4" stroke-width="1.2" opacity="0.5"/>
    <path class="aa-link aa-l2" d="M128 109 L182 117 L186 203" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.42"/>
    <path class="aa-link aa-l3" d="M76 191 L88 265 L186 285" fill="none" stroke="#2DD4BF" stroke-width="1" opacity="0.38"/>
    <line class="aa-link" x1="128" y1="109" x2="186" y2="203" stroke="#BAE6FD" stroke-width="1" opacity="0.35"/>
  </g>

  <!-- Right mosaic -->
  <g transform="translate(1200,0) scale(-1,1)">
    <rect class="aa-tile aa-t3" x="22" y="66" width="116" height="82" rx="6" fill="#CCFBF1" stroke="#99F6E4" stroke-width="1.2"/>
    <rect class="aa-tile aa-t1" x="22" y="158" width="82" height="62" rx="6" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2"/>
    <rect class="aa-tile aa-t4" x="110" y="154" width="94" height="94" rx="6" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="1.2"/>
    <rect class="aa-tile aa-t2" x="22" y="230" width="130" height="70" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2"/>
    <rect class="aa-tile aa-t1" x="158" y="74" width="70" height="70" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>

    <path class="aa-link aa-l2" d="M138 107 L164 198 L94 192" fill="none" stroke="#14B8A6" stroke-width="1.2" opacity="0.48"/>
    <path class="aa-link" d="M138 107 L198 115 L202 203" fill="none" stroke="#4A90E2" stroke-width="1" opacity="0.4"/>
    <path class="aa-link aa-l3" d="M94 192 L106 268 L206 290" fill="none" stroke="#5EEAD4" stroke-width="1" opacity="0.36"/>
  </g>
</svg>
