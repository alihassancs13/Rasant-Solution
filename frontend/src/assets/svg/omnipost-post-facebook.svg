    </linearGradient>
    <filter id="fbSh"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7C3AED" flood-opacity="0.1"/></filter>
  </defs>
  <rect width="300" height="400" rx="16" fill="white" stroke="#E2E8F0" stroke-width="1.5" filter="url(#fbSh)"/>
  <circle cx="40" cy="40" r="20" fill="#1877F2"/>
  <text x="40" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="800" fill="white">R</text>
  <text x="72" y="36" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#050505">Rasant Solutions</text>
