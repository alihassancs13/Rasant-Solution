  <text x="20" y="118" font-family="Inter,sans-serif" font-size="11" fill="#1877F2">#OmniPost #SocialMedia #AI</text>
  <rect x="20" y="132" width="260" height="160" rx="10" fill="url(#fbImg)"/>
  <text x="150" y="218" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="18" font-weight="800" fill="white">OmniPost</text>
