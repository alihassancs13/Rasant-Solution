<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="ch-bg" x1="80" y1="40" x2="480" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8F2FC"/>
      <stop offset="0.5" stop-color="#F3E8FF"/>
      <stop offset="1" stop-color="#E6FAF5"/>
    </linearGradient>
    <linearGradient id="ch-screen" x1="120" y1="120" x2="360" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E4A7A"/>
      <stop offset="1" stop-color="#4A90E2"/>
    </linearGradient>
    <linearGradient id="ch-accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#6BA3E8"/>
    </linearGradient>
    <linearGradient id="ch-orange" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#E76F00"/>
    </linearGradient>
    <filter id="ch-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2A5F9E" flood-opacity="0.18"/>
    </filter>
    <filter id="ch-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .ch-float { animation: chFloat 5s ease-in-out infinite; }
    .ch-float-delay { animation: chFloat 5s ease-in-out infinite; animation-delay: -2.5s; }
    .ch-pulse { animation: chPulse 2.4s ease-in-out infinite; }
    .ch-spin { animation: chSpin 20s linear infinite; transform-origin: 280px 240px; }
    @keyframes chFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes chPulse {
      0%, 100% { opacity: 0.55; r: 6; }
      50% { opacity: 1; r: 8; }
    }
    @keyframes chSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Ambient glow -->
  <ellipse cx="280" cy="250" rx="200" ry="160" fill="url(#ch-bg)" opacity="0.9"/>
  <circle cx="420" cy="100" r="60" fill="#6BA3E8" opacity="0.12" filter="url(#ch-glow)"/>
  <circle cx="120" cy="360" r="50" fill="#14B8A6" opacity="0.1" filter="url(#ch-glow)"/>

  <!-- Orbit ring -->
  <circle class="ch-spin" cx="280" cy="240" r="168" stroke="#4A90E2" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.25"/>

  <!-- Main monitor -->
  <g class="ch-float" filter="url(#ch-shadow)">
    <rect x="108" y="108" width="280" height="188" rx="16" fill="#fff" stroke="#C9D9F0" stroke-width="2"/>
    <rect x="124" y="124" width="248" height="148" rx="8" fill="url(#ch-screen)"/>
    <!-- Code lines -->
    <rect x="144" y="148" width="72" height="6" rx="3" fill="#14B8A6" opacity="0.9"/>
    <rect x="144" y="164" width="120" height="5" rx="2.5" fill="#fff" opacity="0.35"/>
    <rect x="144" y="178" width="96" height="5" rx="2.5" fill="#FFD5B4" opacity="0.7"/>
    <rect x="144" y="192" width="108" height="5" rx="2.5" fill="#fff" opacity="0.25"/>
    <rect x="144" y="206" width="64" height="5" rx="2.5" fill="#C9C4F8" opacity="0.8"/>
    <rect x="144" y="228" width="140" height="5" rx="2.5" fill="#fff" opacity="0.2"/>
    <rect x="144" y="242" width="88" height="5" rx="2.5" fill="#14B8A6" opacity="0.5"/>
    <!-- Cursor blink -->
    <rect x="236" y="206" width="3" height="14" rx="1" fill="#fff" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <!-- Stand -->
    <path d="M248 296h40v12c0 4-2 6-6 6h-28c-4 0-6-2-6-6v-12z" fill="#E8F2FC" stroke="#C9D9F0" stroke-width="1.5"/>
    <rect x="220" y="314" width="96" height="8" rx="4" fill="#D4E4F7"/>
  </g>

  <!-- Team avatars -->
  <g class="ch-float-delay">
    <circle cx="88" cy="180" r="32" fill="#fff" stroke="#4A90E2" stroke-width="2.5" filter="url(#ch-shadow)"/>
    <circle cx="88" cy="168" r="12" fill="#2A5F9E"/>
    <path d="M68 200c4-10 14-14 20-14s16 4 20 14" stroke="#2A5F9E" stroke-width="3" stroke-linecap="round" fill="none"/>

    <circle cx="472" cy="200" r="32" fill="#fff" stroke="#14B8A6" stroke-width="2.5" filter="url(#ch-shadow)"/>
    <circle cx="472" cy="188" r="12" fill="#14B8A6"/>
    <path d="M452 220c4-10 14-14 20-14s16 4 20 14" stroke="#14B8A6" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Floating tech badges -->
  <g class="ch-float">
    <rect x="36" y="300" width="88" height="36" rx="18" fill="#fff" stroke="#E76F00" stroke-width="1.5" filter="url(#ch-shadow)"/>
    <circle cx="58" cy="318" r="10" fill="url(#ch-orange)"/>
    <text x="76" y="323" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1E293B">Java</text>
  </g>

  <g class="ch-float-delay">
    <rect x="420" y="320" width="96" height="36" rx="18" fill="#fff" stroke="#42B883" stroke-width="1.5" filter="url(#ch-shadow)"/>
    <circle cx="442" cy="338" r="10" fill="#42B883"/>
    <text x="460" y="343" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1E293B">Vue.js</text>
  </g>

  <!-- Connection nodes -->
  <circle class="ch-pulse" cx="280" cy="88" r="7" fill="#4A90E2"/>
  <circle class="ch-pulse" cx="480" cy="280" r="6" fill="#14B8A6" style="animation-delay:-1.2s"/>
  <circle class="ch-pulse" cx="64" cy="260" r="6" fill="#8E6CF0" style="animation-delay:-0.6s"/>

  <!-- Growth arrow -->
  <g class="ch-float" opacity="0.9">
    <rect x="400" y="72" width="120" height="64" rx="14" fill="#fff" stroke="#C9D9F0" stroke-width="1.5" filter="url(#ch-shadow)"/>
    <path d="M420 112h60M450 92v40" stroke="url(#ch-accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M442 100l8 8-8 8" stroke="url(#ch-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="416" y="88" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#64748B">Your growth</text>
  </g>

  <!-- Handshake / join badge -->
  <g class="ch-float-delay">
    <circle cx="280" cy="400" r="36" fill="url(#ch-accent)" filter="url(#ch-shadow)"/>
    <path d="M262 398c0-6 5-10 10-10 3 0 6 1 8 4 2-3 5-4 8-4 5 0 10 4 10 10 0 8-10 14-18 18-8-4-18-10-18-18z" fill="#fff" opacity="0.95"/>
    <path d="M268 396l6 6 14-14" stroke="#14B8A6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
