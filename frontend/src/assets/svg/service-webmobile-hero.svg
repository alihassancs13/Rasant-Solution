<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-label="Web applications">
  <defs>
    <linearGradient id="wmhBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F0FF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="wmhAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4A90E2"/>
    </linearGradient>
    <filter id="wmhSh"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366F1" flood-opacity="0.12"/></filter>
    <style>
      .wmh-float{animation:wmhFloat 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes wmhFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      .wmh-pulse{animation:wmhPulse 2s ease-in-out infinite}
      @keyframes wmhPulse{0%,100%{opacity:1}50%{opacity:.45}}
    </style>
  </defs>
  <rect width="720" height="480" rx="16" fill="url(#wmhBg)"/>
  <text x="40" y="40" font-family="Space Grotesk,sans-serif" font-size="16" font-weight="800" fill="#1E3A5F">Web applications</text>
  <text x="40" y="60" font-family="Inter,sans-serif" font-size="10" fill="#64748B">Vue.js | React | Tailwind | HTML / CSS</text>

  <g class="wmh-float" filter="url(#wmhSh)">
    <rect x="80" y="90" width="520" height="260" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="80" y="90" width="520" height="36" rx="14" fill="#1E3A5F"/>
    <text x="100" y="114" font-size="11" font-weight="700" fill="#FFFFFF">rasantsolutions.com</text>
    <rect x="100" y="140" width="480" height="24" rx="6" fill="#EFF6FF"/>
    <text x="112" y="156" font-size="9" fill="#2A5F9E">Hero | Products | Services | Contact</text>
    <rect x="100" y="176" width="220" height="140" rx="8" fill="url(#wmhAccent)" opacity=".12"/>
    <text x="112" y="200" font-size="10" font-weight="700" fill="#4338CA">Vue + React UI</text>
    <text x="112" y="218" font-size="8" fill="#64748B">Component-driven frontends</text>
    <rect x="112" y="232" width="88" height="22" rx="6" fill="#42B883" opacity=".2"/>
    <text x="156" y="247" text-anchor="middle" font-size="8" fill="#059669">Vue.js</text>
    <rect x="208" y="232" width="88" height="22" rx="6" fill="#61DAFB" opacity=".25"/>
    <text x="252" y="247" text-anchor="middle" font-size="8" fill="#0284C7">React</text>
    <rect x="340" y="176" width="240" height="140" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="356" y="192" width="208" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="356" y="208" width="160" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="356" y="224" width="120" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="356" y="252" width="96" height="28" rx="6" fill="#4A90E2"/>
    <text x="404" y="270" text-anchor="middle" font-size="8" font-weight="600" fill="#FFF">Get started</text>
    <rect x="100" y="330" width="480" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="100" y="330" width="360" height="8" rx="4" fill="#38BDF8" opacity=".6"/>
    <text x="100" y="352" font-size="8" fill="#64748B">Tailwind utility classes | responsive breakpoints</text>
  </g>

  <rect x="40" y="380" width="640" height="72" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="56" y="408" font-size="9" font-weight="700" fill="#64748B">STACK</text>
  <rect x="56" y="418" width="72" height="24" rx="6" fill="#ECFDF5"/><text x="92" y="434" text-anchor="middle" font-size="8" fill="#059669">Vue.js</text>
  <rect x="136" y="418" width="72" height="24" rx="6" fill="#EFF6FF"/><text x="172" y="434" text-anchor="middle" font-size="8" fill="#0284C7">React</text>
  <rect x="216" y="418" width="72" height="24" rx="6" fill="#ECFEFF"/><text x="252" y="434" text-anchor="middle" font-size="8" fill="#0284C7">Tailwind</text>
  <rect x="296" y="418" width="72" height="24" rx="6" fill="#FFF1F2"/><text x="332" y="434" text-anchor="middle" font-size="8" fill="#E34F26">HTML</text>
  <circle cx="640" cy="430" r="8" fill="#14B8A6" class="wmh-pulse"/>
  <text x="656" y="434" font-size="9" fill="#059669">Responsive</text>
</svg>
