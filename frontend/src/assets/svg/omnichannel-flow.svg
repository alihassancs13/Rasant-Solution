<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-label="Omnichannel customer service platform flow">
  <defs>
    <linearGradient id="ocCol1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <linearGradient id="ocCol2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="ocCol3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="ocBluePill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="ocCyanPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="ocRobotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="ocHubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD5B4"/>
      <stop offset="50%" stop-color="#C9C4F8"/>
      <stop offset="100%" stop-color="#4A90E2"/>
    </linearGradient>
    <linearGradient id="ocArrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="ocRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="33%" stop-color="#10B981"/>
      <stop offset="66%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="ocShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4A90E2" flood-opacity="0.12"/>
    </filter>
    <style>
      .oc-flow { stroke-dasharray: 8 6; animation: ocFlow 1s linear infinite; }
      @keyframes ocFlow { to { stroke-dashoffset: -28; } }
      .oc-pulse { animation: ocPulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes ocPulse { 0%,100% { opacity: 1; filter: brightness(1); } 50% { opacity: 0.88; filter: brightness(1.08); } }
      .oc-ring { animation: ocSpin 12s linear infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes ocSpin { to { transform: rotate(360deg); } }
      .oc-fade { opacity: 0; animation: ocFade 0.5s ease forwards; }
      .oc-fade.d1 { animation-delay: 0.06s; } .oc-fade.d2 { animation-delay: 0.12s; }
      .oc-fade.d3 { animation-delay: 0.18s; } .oc-fade.d4 { animation-delay: 0.24s; }
      .oc-fade.d5 { animation-delay: 0.30s; } .oc-fade.d6 { animation-delay: 0.36s; }
      .oc-fade.d7 { animation-delay: 0.42s; } .oc-fade.d8 { animation-delay: 0.48s; }
      @keyframes ocFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      .oc-arrow { animation: ocArrow 1.8s ease-in-out infinite; }
      @keyframes ocArrow { 0%,100% { opacity: 0.65; } 50% { opacity: 1; } }
      .oc-glow { animation: ocGlow 3s ease-in-out infinite; }
      @keyframes ocGlow { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
    </style>
  </defs>

  <!-- Column 1 - channels -->
  <g filter="url(#ocShadow)">
    <rect x="24" y="40" width="148" height="420" rx="16" fill="url(#ocCol1Bg)" stroke="#10B981" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="98" y="68" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700" fill="#065F46">Omni-channel access</text>
    <text x="98" y="80" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="8" fill="#047857">integration</text>
  </g>

  <g font-family="Inter,Arial,sans-serif" font-size="8" fill="#334155">
    <g class="oc-fade d1"><circle cx="52" cy="108" r="15" fill="#DBEAFE"/><text x="52" y="112" text-anchor="middle" font-size="10" font-weight="800" fill="#2563EB">W</text><text x="78" y="112">Website</text></g>
    <g class="oc-fade d2"><circle cx="52" cy="142" r="15" fill="#FFEDD5"/><text x="52" y="146" text-anchor="middle" font-size="7" font-weight="800" fill="#EA580C">App</text><text x="78" y="146">Mobile APP</text></g>
    <g class="oc-fade d3"><circle cx="52" cy="176" r="15" fill="#DCFCE7"/><text x="52" y="180" text-anchor="middle" font-size="7" font-weight="800" fill="#16A34A">WC</text><text x="78" y="180">WeChat</text></g>
    <g class="oc-fade d4"><circle cx="52" cy="210" r="15" fill="#DBEAFE"/><text x="52" y="214" text-anchor="middle" font-size="10" font-weight="800" fill="#1D4ED8">f</text><text x="78" y="214">Facebook</text></g>
    <g class="oc-fade d5"><circle cx="52" cy="244" r="15" fill="#D1FAE5"/><text x="52" y="248" text-anchor="middle" font-size="7" font-weight="800" fill="#059669">WA</text><text x="78" y="248">WhatsApp</text></g>
    <g class="oc-fade d6"><circle cx="52" cy="278" r="15" fill="#FEF3C7"/><text x="52" y="282" text-anchor="middle" font-size="8" font-weight="800" fill="#D97706">H5</text><text x="78" y="282">H5 Page</text></g>
    <g class="oc-fade d7"><circle cx="52" cy="312" r="15" fill="#E0E7FF"/><text x="52" y="316" text-anchor="middle" font-size="9" font-weight="800" fill="#4F46E5">@</text><text x="78" y="316">Mail</text></g>
    <g class="oc-fade d8"><circle cx="52" cy="346" r="15" fill="#FEE2E2"/><text x="52" y="350" text-anchor="middle" font-size="7" font-weight="800" fill="#DC2626">Tel</text><text x="78" y="350">400 / Phone</text></g>
    <text x="98" y="382" text-anchor="middle" font-size="14" fill="#6EE7B7">...</text>
  </g>

  <!-- Arrow 1 -->
  <g class="oc-arrow">
    <path d="M178 250 H218 M210 242 L218 250 L210 258" fill="none" stroke="#06B6D4" stroke-width="2.5"/>
    <rect x="182" y="228" width="36" height="44" rx="6" fill="url(#ocArrowGrad)"/>
    <text x="200" y="248" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" font-weight="800" fill="#4A90E2" transform="rotate(-90 200 248)">Speed up</text>
    <text x="200" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" font-weight="800" fill="#4A90E2" transform="rotate(-90 200 258)">Service</text>
  </g>

  <!-- Column 2 -->
  <g filter="url(#ocShadow)">
    <rect x="228" y="40" width="320" height="420" rx="16" fill="url(#ocCol2Bg)" stroke="#22C55E" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="388" y="62" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700" fill="#166534">Assist agents - improve response efficiency</text>
  </g>

  <rect x="248" y="78" width="130" height="28" rx="14" fill="url(#ocBluePill)"/>
  <text x="313" y="96" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="600" fill="#fff">All-media online service</text>
  <rect x="398" y="78" width="130" height="28" rx="14" fill="url(#ocCyanPill)"/>
  <text x="463" y="96" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="600" fill="#fff">Cloud Call Center</text>

  <rect x="248" y="118" width="280" height="36" rx="8" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.5"/>
  <text x="388" y="140" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="600" fill="#15803D">Intelligent allocation (routing + scheduling)</text>

  <rect class="oc-pulse" x="308" y="168" width="160" height="40" rx="8" fill="url(#ocRobotGrad)" stroke="#047857" stroke-width="1"/>
  <text x="388" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="800" fill="#fff">Smart Robot</text>

  <line x1="348" y1="208" x2="318" y2="248" stroke="#10B981" stroke-width="2" class="oc-flow"/>
  <line x1="428" y1="208" x2="458" y2="248" stroke="#3B82F6" stroke-width="2" class="oc-flow"/>
  <text x="268" y="238" font-family="Inter,Arial,sans-serif" font-size="7" font-weight="600" fill="#059669">Self-service Q&amp;A</text>
  <text x="410" y="238" font-family="Inter,Arial,sans-serif" font-size="7" font-weight="600" fill="#2563EB">Human-machine assist</text>

  <rect x="248" y="252" width="280" height="44" rx="8" fill="#fff" stroke="#4A90E2" stroke-width="2"/>
  <text x="388" y="278" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#4A90E2">Customer Service / Agent Workbench</text>

  <rect x="258" y="312" width="80" height="32" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="298" y="332" text-anchor="middle" font-size="8" font-weight="600" fill="#B45309">Knowledge base</text>
  <rect x="348" y="312" width="80" height="32" rx="8" fill="#FFEDD5" stroke="#F97316" stroke-width="1.2"/>
  <text x="388" y="332" text-anchor="middle" font-size="8" font-weight="600" fill="#C2410C">CRM</text>
  <rect x="438" y="312" width="80" height="32" rx="8" fill="#FCE7F3" stroke="#EC4899" stroke-width="1.2"/>
  <text x="478" y="332" text-anchor="middle" font-size="8" font-weight="600" fill="#BE185D">Smart Work Order</text>

  <!-- Arrow 2 -->
  <g class="oc-arrow">
    <path d="M556 250 H596 M588 242 L596 250 L588 258" fill="none" stroke="#8B5CF6" stroke-width="2.5"/>
    <rect x="560" y="228" width="36" height="44" rx="6" fill="url(#ocArrowGrad)"/>
    <text x="578" y="246" text-anchor="middle" font-size="7" font-weight="800" fill="#4A90E2" transform="rotate(-90 578 246)">Service</text>
    <text x="578" y="256" text-anchor="middle" font-size="7" font-weight="800" fill="#4A90E2" transform="rotate(-90 578 256)">Supervision</text>
  </g>

  <!-- Column 3 -->
  <g filter="url(#ocShadow)">
    <rect x="606" y="40" width="320" height="420" rx="16" fill="url(#ocCol3Bg)" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="766" y="62" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700" fill="#1E40AF">Service + Operation Control</text>
    <text x="766" y="74" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="8" fill="#2563EB">Ensure service quality</text>
  </g>

  <circle class="oc-ring" cx="766" cy="248" r="60" fill="none" stroke="url(#ocRingGrad)" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.85"/>
  <circle cx="766" cy="248" r="48" fill="url(#ocHubGrad)" class="oc-pulse"/>
  <circle cx="766" cy="248" r="34" fill="#fff" opacity="0.97"/>
  <text x="766" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="800" fill="#4A90E2">Manager</text>
  <text x="766" y="256" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="800" fill="#7C3AED">Workbench</text>

  <line x1="718" y1="208" x2="668" y2="168" stroke="#10B981" stroke-width="1.5" class="oc-flow"/>
  <rect x="628" y="148" width="88" height="32" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.2"/>
  <text x="672" y="168" text-anchor="middle" font-size="8" font-weight="700" fill="#047857">Data report</text>
  <text x="672" y="182" text-anchor="middle" font-size="6" fill="#059669">operational data</text>

  <line x1="814" y1="208" x2="864" y2="168" stroke="#3B82F6" stroke-width="1.5" class="oc-flow"/>
  <rect x="824" y="148" width="88" height="32" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="868" y="168" text-anchor="middle" font-size="8" font-weight="700" fill="#1D4ED8">Large screen</text>

  <line x1="718" y1="288" x2="668" y2="328" stroke="#F59E0B" stroke-width="1.5" class="oc-flow"/>
  <rect x="628" y="318" width="88" height="32" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="672" y="338" text-anchor="middle" font-size="8" font-weight="700" fill="#B45309">Real-time monitoring</text>

  <line x1="814" y1="288" x2="864" y2="328" stroke="#EC4899" stroke-width="1.5" class="oc-flow"/>
  <rect x="824" y="318" width="88" height="32" rx="8" fill="#FCE7F3" stroke="#EC4899" stroke-width="1.2"/>
  <text x="868" y="338" text-anchor="middle" font-size="8" font-weight="700" fill="#BE185D">Quality inspection</text>

  <!-- Decorative floating dots -->
  <circle class="oc-glow" cx="200" cy="120" r="4" fill="#06B6D4" opacity="0.7"/>
  <circle class="oc-glow" cx="540" cy="380" r="3" fill="#F59E0B" opacity="0.7" style="animation-delay:-1s"/>
  <circle class="oc-glow" cx="880" cy="400" r="4" fill="#EC4899" opacity="0.7" style="animation-delay:-2s"/>
</svg>
