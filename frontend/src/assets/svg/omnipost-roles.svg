<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="OmniPost team roles workflow">
  <defs>
    <filter id="oprSh"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7C3AED" flood-opacity="0.12"/></filter>
    <linearGradient id="oprGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#6366F1"/></linearGradient>
    <style>
      .opr-flow { animation: oprFlow 2.5s ease-in-out infinite; }
      @keyframes oprFlow { 0%,100%{opacity:.3} 50%{opacity:1} }
      .opr-float{animation:oprFloat 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .opr-float.f2{animation-delay:-1.5s}
      @keyframes oprFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    </style>
  </defs>
  <rect width="960" height="420" rx="16" fill="#FAFAFE"/>
  <text x="480" y="40" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="16" font-weight="800" fill="#312E81">One workspace  -  roles routed together</text>
  <text x="480" y="60" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#64748B">Creators, approvers, owners, and schedulers with clear permissions</text>

  <g class="opr-float" filter="url(#oprSh)">
    <rect x="60" y="88" width="400" height="72" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="60" y="88" width="400" height="4" rx="14" fill="#7C3AED"/>
    <circle cx="96" cy="124" r="20" fill="#EDE9FE"/><text x="96" y="129" text-anchor="middle" font-size="12" font-weight="800" fill="#7C3AED">C</text>
    <text x="128" y="116" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#1E293B">Creator</text>
    <text x="128" y="134" font-family="Inter,sans-serif" font-size="9" fill="#64748B">Drafts &amp; submits posts  |  AI generation access</text>
    <rect x="360" y="112" width="72" height="24" rx="12" fill="#D1FAE5"/><text x="396" y="128" text-anchor="middle" font-size="9" font-weight="700" fill="#059669">Active</text>
    <text x="128" y="150" font-family="Inter,sans-serif" font-size="8" fill="#7C3AED">-> submits to approval queue</text>
  </g>

  <path d="M260,160v28" stroke="#C4B5FD" stroke-width="2" class="opr-flow"/>

  <g class="opr-float f2" filter="url(#oprSh)">
    <rect x="60" y="188" width="400" height="72" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="60" y="188" width="400" height="4" rx="14" fill="#F59E0B"/>
    <circle cx="96" cy="224" r="20" fill="#FEF3C7"/><text x="96" y="229" text-anchor="middle" font-size="12" font-weight="800" fill="#D97706">A</text>
    <text x="128" y="216" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#1E293B">Approver</text>
    <text x="128" y="234" font-family="Inter,sans-serif" font-size="9" fill="#64748B">Reviews before publish  |  approve / reject / revise</text>
    <rect x="360" y="212" width="72" height="24" rx="12" fill="#FEF3C7"/><text x="396" y="228" text-anchor="middle" font-size="9" font-weight="700" fill="#D97706">12 Queue</text>
    <text x="128" y="250" font-family="Inter,sans-serif" font-size="8" fill="#D97706">-> hands off to scheduler when approved</text>
  </g>

  <path d="M260,260v28" stroke="#C4B5FD" stroke-width="2" class="opr-flow"/>

  <g filter="url(#oprSh)">
    <rect x="60" y="288" width="190" height="100" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="96" cy="328" r="18" fill="#E0E7FF"/><text x="96" y="333" text-anchor="middle" font-size="11" font-weight="800" fill="#4F46E5">O</text>
    <text x="124" y="320" font-size="11" font-weight="700" fill="#1E293B">Org owner</text>
    <text x="124" y="336" font-size="8" fill="#64748B">Users  |  billing  |  accounts</text>
    <rect x="124" y="348" width="52" height="20" rx="10" fill="#E0E7FF"/><text x="150" y="362" text-anchor="middle" font-size="8" font-weight="700" fill="#4F46E5">Admin</text>
    <rect x="270" y="288" width="190" height="100" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="306" cy="328" r="18" fill="#DCFCE7"/><text x="306" y="333" text-anchor="middle" font-size="11" font-weight="800" fill="#16A34A">S</text>
    <text x="334" y="320" font-size="11" font-weight="700" fill="#1E293B">Scheduler</text>
    <text x="334" y="336" font-size="8" fill="#64748B">Auto-publish on time</text>
    <rect x="334" y="348" width="52" height="20" rx="10" fill="#D1FAE5"/><text x="360" y="362" text-anchor="middle" font-size="8" font-weight="700" fill="#059669">Live</text>
  </g>

  <!-- Right: workspace preview -->
  <g filter="url(#oprSh)">
    <rect x="500" y="88" width="400" height="300" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <rect x="500" y="88" width="400" height="40" rx="14" fill="url(#oprGrad)"/>
    <text x="520" y="114" font-family="Space Grotesk,sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">Shared workspace</text>
    <circle cx="860" cy="108" r="6" fill="#10B981" class="opr-flow"/>
    <text x="872" y="112" font-size="8" font-weight="700" fill="#FFFFFF">LIVE</text>

    <rect x="520" y="144" width="360" height="48" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="536" y="164" font-size="9" font-weight="600" fill="#7C3AED">Sara (Creator)</text>
    <text x="536" y="180" font-size="8" fill="#64748B">Submitted "Summer launch" for review</text>
    <text x="820" y="172" font-size="8" fill="#94A3B8">2m ago</text>

    <rect x="520" y="200" width="360" height="48" rx="8" fill="#FEF3C7" stroke="#F59E0B"/>
    <text x="536" y="220" font-size="9" font-weight="600" fill="#D97706">Ahmed (Approver)</text>
    <text x="536" y="236" font-size="8" fill="#64748B">Reviewing pending queue  |  12 items</text>
    <text x="820" y="228" font-size="8" fill="#94A3B8">Now</text>

    <rect x="520" y="256" width="360" height="48" rx="8" fill="#F0FDF4" stroke="#10B981"/>
    <text x="536" y="276" font-size="9" font-weight="600" fill="#059669">Nadia (Scheduler)</text>
    <text x="536" y="292" font-size="8" fill="#64748B">Scheduled 3 posts for today  |  34 queued</text>
    <text x="820" y="284" font-size="8" fill="#94A3B8">5m ago</text>

    <rect x="520" y="320" width="360" height="52" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="536" y="342" font-size="9" font-weight="700" fill="#7C3AED">Real-time handoffs</text>
    <text x="536" y="358" font-size="8" fill="#64748B">Creator -> Approver -> Scheduler  |  permissions enforced</text>
  </g>

  <rect x="380" y="396" width="200" height="28" rx="14" fill="url(#oprGrad)"/>
  <text x="480" y="414" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="700" fill="white">Shared workspace</text>
</svg>
