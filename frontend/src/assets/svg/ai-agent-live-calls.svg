  <circle cx="28" cy="258" r="4" fill="#34D399" class="lc-pulse"/>
  <text x="40" y="261" font-size="8" fill="#64748B" font-family="Inter,Arial,sans-serif">Streaming live - 130 calls in queue history</text>
