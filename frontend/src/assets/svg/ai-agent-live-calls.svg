    <text x="510" y="140" font-size="9" fill="#334155" font-family="Inter,Arial,sans-serif">Awais Alii</text>
    <text x="640" y="140" font-size="8" fill="#64748B" font-family="Inter,Arial,sans-serif">2026-06-12 11:16:54</text>
    <g fill="#94A3B8" transform="translate(818,130)">
      <circle cx="6" cy="8" r="5" fill="none" stroke="#94A3B8"/><circle cx="6" cy="8" r="2" fill="#94A3B8"/>
      <polygon points="24,4 30,8 24,12" fill="#94A3B8"/>
      <rect x="38" y="4" width="8" height="8" rx="1" fill="#94A3B8"/>
      <circle cx="56" cy="6" r="3" fill="#94A3B8"/><path d="M52 12h8v4h-8z" fill="#94A3B8"/>
