    <text x="57" y="220" text-anchor="middle" font-size="8" font-weight="600" fill="#047857" font-family="Inter,Arial,sans-serif">Answered</text>
    <text x="110" y="220" font-size="9" fill="#334155" font-family="Inter,Arial,sans-serif">+923009876543</text>
    <text x="260" y="220" font-size="9" fill="#334155" font-family="Inter,Arial,sans-serif">00:01:45</text>
    <text x="360" y="220" font-size="9" fill="#334155" font-family="Inter,Arial,sans-serif">Danison</text>
    <text x="480" y="220" font-size="9" fill="#2A5F9E" font-family="Inter,Arial,sans-serif">+ Assign</text>
