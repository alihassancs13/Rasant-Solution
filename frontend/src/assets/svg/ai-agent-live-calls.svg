    <text x="57" y="180" text-anchor="middle" font-size="8" font-weight="600" fill="#047857" font-family="Inter,Arial,sans-serif">Answered</text>
    <text x="110" y="180" font-size="9" fill="#334155" font-family="Inter,Arial,sans-serif">+923001234567</text>
    <text x="260" y="180" font-size="9" fill="#334155" font-family="Inter,Arial,sans-serif">00:03:12</text>
    <text x="360" y="180" font-size="9" fill="#334155" font-family="Inter,Arial,sans-serif">Danison</text>
    <text x="480" y="180" font-size="9" fill="#2A5F9E" font-family="Inter,Arial,sans-serif">+ Assign</text>
    <text x="640" y="180" font-size="8" fill="#64748B" font-family="Inter,Arial,sans-serif">2026-06-12 11:10:22</text>
