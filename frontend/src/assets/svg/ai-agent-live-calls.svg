      @keyframes lcRow { from{opacity:0;transform:translateX(-8px)} to{opacity:1;transform:translateX(0)} }
      .lc-pulse { animation: lcPulse 2s ease-in-out infinite; }
      @keyframes lcPulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    </style>
  </defs>
  <rect width="920" height="280" rx="12" fill="white" stroke="#E2E8F0"/>
  <rect x="16" y="14" width="28" height="28" rx="8" fill="#2DD4BF"/>
  <text x="54" y="28" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#1E293B">Live Calls</text>
  <text x="54" y="44" font-family="Inter,Arial,sans-serif" font-size="9" fill="#64748B">Monitor and manage active calls</text>
  <rect x="720" y="16" width="72" height="28" rx="8" fill="white" stroke="#E2E8F0"/>
  <text x="756" y="34" text-anchor="middle" font-size="9" fill="#475569" font-family="Inter,Arial,sans-serif">Export</text>
  <rect x="800" y="16" width="104" height="28" rx="8" fill="#2A5F9E"/>
