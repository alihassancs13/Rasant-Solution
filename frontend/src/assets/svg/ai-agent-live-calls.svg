<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" role="img" aria-label="Live calls monitoring table">
  <defs>
    <style>
      .lc-row { opacity: 0; animation: lcRow 0.5s ease forwards; }
