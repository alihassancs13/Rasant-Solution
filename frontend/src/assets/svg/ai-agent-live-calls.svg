  <text x="16" y="72" font-size="11" font-weight="700" fill="#1E293B" font-family="Inter,Arial,sans-serif">Call Records</text>
  <text x="110" y="72" font-size="9" fill="#94A3B8" font-family="Inter,Arial,sans-serif">130 total calls</text>

  <rect x="16" y="82" width="888" height="28" rx="6" fill="#F8FAFC"/>
  <text x="28" y="100" font-size="8" font-weight="700" fill="#94A3B8" font-family="Inter,Arial,sans-serif">STATUS</text>
  <text x="110" y="100" font-size="8" font-weight="700" fill="#94A3B8" font-family="Inter,Arial,sans-serif">NUMBER</text>
  <text x="260" y="100" font-size="8" font-weight="700" fill="#94A3B8" font-family="Inter,Arial,sans-serif">DURATION</text>
  <text x="360" y="100" font-size="8" font-weight="700" fill="#94A3B8" font-family="Inter,Arial,sans-serif">AI AGENT</text>
  <text x="480" y="100" font-size="8" font-weight="700" fill="#94A3B8" font-family="Inter,Arial,sans-serif">ASSIGNED USER</text>
  <text x="640" y="100" font-size="8" font-weight="700" fill="#94A3B8" font-family="Inter,Arial,sans-serif">TIME</text>
  <text x="820" y="100" font-size="8" font-weight="700" fill="#94A3B8" font-family="Inter,Arial,sans-serif">ACTIONS</text>

  <g class="lc-row r1">
    <line x1="16" y1="118" x2="904" y2="118" stroke="#F1F5F9"/>
    <rect x="28" y="128" width="58" height="18" rx="9" fill="#D1FAE5"/>
    <text x="57" y="140" text-anchor="middle" font-size="8" font-weight="600" fill="#047857" font-family="Inter,Arial,sans-serif">Answered</text>
    <text x="110" y="140" font-size="9" fill="#334155" font-family="Inter,Arial,sans-serif">+923155580687</text>
    <text x="260" y="140" font-size="9" fill="#334155" font-family="Inter,Arial,sans-serif">00:06:26</text>
    <text x="360" y="140" font-size="9" fill="#334155" font-family="Inter,Arial,sans-serif">Danison</text>
    <circle cx="492" cy="136" r="10" fill="#34D399"/>
