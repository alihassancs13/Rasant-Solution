    <text x="200" y="340" font-family="Inter,sans-serif" font-size="9" fill="#64748B">General FAQ</text>
    <rect x="400" y="318" width="120" height="24" rx="6" fill="#ECFDF5" stroke="#34D399"/>
    <text x="460" y="334" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" font-weight="600" fill="#047857">Support</text>
