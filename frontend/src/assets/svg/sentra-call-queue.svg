  <text x="200" y="118" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#64748B">CALLER</text>
  <text x="400" y="118" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#64748B">SKILL</text>
  <text x="560" y="118" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#64748B">WAIT</text>
  <text x="720" y="118" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#64748B">ASSIGN TO</text>

