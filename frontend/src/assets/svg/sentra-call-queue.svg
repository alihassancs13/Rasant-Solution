  <rect x="24" y="68" width="52" height="22" rx="6" fill="#FEE2E2"/><text x="36" y="83" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#DC2626">High</text>
  <rect x="84" y="68" width="64" height="22" rx="6" fill="#FEF3C7"/><text x="96" y="83" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#D97706">Medium</text>
