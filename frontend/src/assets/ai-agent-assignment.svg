<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-label="Automatic call assignment settings">
  <defs>
    <style>
      .as-in { opacity: 0; animation: asIn 0.6s ease forwards 0.2s; }
      @keyframes asIn { from{opacity:0;transform:scale(0.96)} to{opacity:1;transform:none} }
    </style>
  </defs>
  <rect width="400" height="280" rx="14" fill="white" stroke="#E2E8F0"/>
  <text x="24" y="36" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#1E293B">Automatic Call Assignment</text>
  <text x="376" y="32" text-anchor="middle" font-size="16" fill="#94A3B8" font-family="Arial,sans-serif">x</text>
  <text x="24" y="64" font-size="11" fill="#64748B" font-family="Inter,Arial,sans-serif">Configure automatic call assignment settings:</text>
  <rect x="24" y="78" width="16" height="16" rx="4" fill="#10B981"/>
  <path d="M28 86l3 3 6-7" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <text x="48" y="90" font-size="11" fill="#1E293B" font-family="Inter,Arial,sans-serif">Enable automatic assignment</text>
  <text x="24" y="118" font-size="11" font-weight="700" fill="#1E293B" font-family="Inter,Arial,sans-serif">Assignment Strategy</text>
  <rect x="24" y="128" width="352" height="36" rx="8" fill="white" stroke="#CBD5E1"/>
  <text x="36" y="150" font-size="11" fill="#1E293B" font-family="Inter,Arial,sans-serif">Round Robin</text>
  <path d="M360 142l6 6-6 6" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <g class="as-in">
    <rect x="24" y="176" width="352" height="52" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="0"/>
    <rect x="24" y="176" width="4" height="52" rx="2" fill="#10B981"/>
    <text x="40" y="198" font-size="9" fill="#047857" font-family="Inter,Arial,sans-serif">Distributes calls evenly across all available agents in a</text>
    <text x="40" y="212" font-size="9" fill="#047857" font-family="Inter,Arial,sans-serif">rotating order, ensuring a balanced workload.</text>
  </g>
  <rect x="220" y="244" width="72" height="28" rx="8" fill="white" stroke="#E2E8F0"/>
  <text x="256" y="262" text-anchor="middle" font-size="10" fill="#64748B" font-family="Inter,Arial,sans-serif">Cancel</text>
  <rect x="300" y="244" width="76" height="28" rx="8" fill="#10B981"/>
  <text x="338" y="262" text-anchor="middle" font-size="10" font-weight="600" fill="white" font-family="Inter,Arial,sans-serif">Save Settings</text>
</svg>
