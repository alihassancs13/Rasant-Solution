<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-label="Voice AI agent call flow">
  <defs>
    <linearGradient id="vfGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#2A5F9E"/>
    </linearGradient>
    <style>
      .vf-flow { stroke-dasharray:7 5; animation: vfFlow 1s linear infinite; }
      @keyframes vfFlow { to{stroke-dashoffset:-24} }
      .vf-pulse { animation: vfPulse 2.2s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes vfPulse { 0%,100%{opacity:1} 50%{opacity:.82} }
      .vf-wave { animation: vfWave 1.4s ease-in-out infinite; }
      .vf-wave.w2{animation-delay:.2s}.vf-wave.w3{animation-delay:.4s}
      @keyframes vfWave { 0%,100%{transform:scaleY(.4)} 50%{transform:scaleY(1)} }
    </style>
  </defs>
  <rect width="920" height="300" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>

  <text x="460" y="32" text-anchor="middle" font-family="Space Grotesk,Arial,sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">How your voice agent handles a call</text>

  <!-- Inbound sources -->
  <g>
    <rect x="24" y="56" width="150" height="200" rx="14" fill="white" stroke="#E2E8F0"/>
    <text x="99" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F" font-family="Inter,Arial,sans-serif">Call sources</text>
    <rect x="40" y="96" width="118" height="32" rx="8" fill="#EFF6FF" stroke="#8FB9F4"/>
    <text x="99" y="116" text-anchor="middle" font-size="9" fill="#2A5F9E" font-family="Inter,Arial,sans-serif">Customer service line</text>
    <rect x="40" y="136" width="118" height="32" rx="8" fill="#F5F3FF" stroke="#C9C4F8"/>
    <text x="99" y="156" text-anchor="middle" font-size="9" fill="#6D28D9" font-family="Inter,Arial,sans-serif">Internal dialing</text>
    <rect x="40" y="176" width="118" height="32" rx="8" fill="#ECFDF5" stroke="#34D399"/>
    <text x="99" y="196" text-anchor="middle" font-size="9" fill="#047857" font-family="Inter,Arial,sans-serif">Outbound campaigns</text>
    <rect x="40" y="216" width="118" height="28" rx="8" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="99" y="234" text-anchor="middle" font-size="9" fill="#C2410C" font-family="Inter,Arial,sans-serif">Scheduled callbacks</text>
  </g>

  <path class="vf-flow" d="M174 156 H218" stroke="url(#vfGrad)" stroke-width="2.5" fill="none"/>
  <polygon points="218,151 228,156 218,161" fill="#2A5F9E"/>

  <!-- Voice AI core -->
  <g>
    <rect x="232" y="72" width="200" height="168" rx="16" fill="url(#vfGrad)" opacity="0.95"/>
    <text x="332" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="white" font-family="Inter,Arial,sans-serif">VOICE AI AGENT</text>
    <circle class="vf-pulse" cx="332" cy="148" r="36" fill="rgba(255,255,255,0.15)"/>
    <rect x="308" y="124" width="48" height="40" rx="12" fill="rgba(255,255,255,0.2)"/>
    <circle cx="320" cy="140" r="5" fill="white"/><circle cx="344" cy="140" r="5" fill="white"/>
    <g transform="translate(332,168)" fill="white">
      <rect class="vf-wave" x="-18" y="-8" width="4" height="16" rx="2"/>
      <rect class="vf-wave w2" x="-8" y="-12" width="4" height="24" rx="2"/>
      <rect class="vf-wave w3" x="2" y="-10" width="4" height="20" rx="2"/>
      <rect class="vf-wave" x="12" y="-14" width="4" height="28" rx="2"/>
    </g>
    <text x="332" y="210" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.9)" font-family="Inter,Arial,sans-serif">Natural speech - STT and TTS</text>
    <text x="332" y="224" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.75)" font-family="Inter,Arial,sans-serif">Clear, human-like voice</text>
  </g>

  <path class="vf-flow" d="M432 156 H476" stroke="url(#vfGrad)" stroke-width="2.5" fill="none"/>
  <polygon points="476,151 486,156 476,161" fill="#2A5F9E"/>

  <!-- Processing -->
  <g>
    <rect x="490" y="56" width="170" height="200" rx="14" fill="white" stroke="#E2E8F0"/>
    <text x="575" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F" font-family="Inter,Arial,sans-serif">During the call</text>
    <text x="508" y="108" font-size="9" fill="#475569" font-family="Inter,Arial,sans-serif">- Understand intent</text>
    <text x="508" y="126" font-size="9" fill="#475569" font-family="Inter,Arial,sans-serif">- Answer from knowledge</text>
    <text x="508" y="144" font-size="9" fill="#475569" font-family="Inter,Arial,sans-serif">- Collect caller details</text>
    <text x="508" y="162" font-size="9" fill="#475569" font-family="Inter,Arial,sans-serif">- Route or escalate</text>
    <text x="508" y="180" font-size="9" fill="#475569" font-family="Inter,Arial,sans-serif">- Record and transcribe</text>
    <rect x="508" y="196" width="134" height="44" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="575" y="216" text-anchor="middle" font-size="8" fill="#64748B" font-family="Inter,Arial,sans-serif">Reasonable pacing</text>
    <text x="575" y="230" text-anchor="middle" font-size="8" fill="#64748B" font-family="Inter,Arial,sans-serif">and professional tone</text>
  </g>

  <path class="vf-flow" d="M660 156 H704" stroke="url(#vfGrad)" stroke-width="2.5" fill="none"/>
  <polygon points="704,151 714,156 704,161" fill="#2A5F9E"/>

  <!-- Outcomes -->
  <g>
    <rect x="716" y="56" width="180" height="200" rx="14" fill="white" stroke="#E2E8F0"/>
    <text x="806" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F" font-family="Inter,Arial,sans-serif">Outcomes</text>
    <rect x="732" y="96" width="148" height="28" rx="8" fill="#D1FAE5"/>
    <text x="806" y="114" text-anchor="middle" font-size="9" font-weight="600" fill="#047857" font-family="Inter,Arial,sans-serif">Issue resolved on call</text>
    <rect x="732" y="132" width="148" height="28" rx="8" fill="#EFF6FF"/>
    <text x="806" y="150" text-anchor="middle" font-size="9" font-weight="600" fill="#2A5F9E" font-family="Inter,Arial,sans-serif">Ticket or follow-up created</text>
    <rect x="732" y="168" width="148" height="28" rx="8" fill="#F5F3FF"/>
    <text x="806" y="186" text-anchor="middle" font-size="9" font-weight="600" fill="#6D28D9" font-family="Inter,Arial,sans-serif">Warm transfer to staff</text>
    <rect x="732" y="204" width="148" height="28" rx="8" fill="#FEF3C7"/>
    <text x="806" y="222" text-anchor="middle" font-size="9" font-weight="600" fill="#B45309" font-family="Inter,Arial,sans-serif">Logged in analytics</text>
  </g>

  <rect x="120" y="268" width="680" height="22" rx="11" fill="rgba(42,95,158,0.06)" stroke="rgba(42,95,158,0.12)"/>
  <text x="460" y="283" text-anchor="middle" font-size="9" fill="#475569" font-family="Inter,Arial,sans-serif">Built for phone-first workflows - chat and text agents are covered on our Chatbot product page</text>
</svg>
