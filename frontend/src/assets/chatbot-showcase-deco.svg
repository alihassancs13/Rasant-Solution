<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" preserveAspectRatio="xMidYMid slice" role="presentation" aria-hidden="true">
  <defs>
    <style>
      .cb-tile { animation: cbTilePulse 5s ease-in-out infinite; }
      .cb-t1 { animation-delay: 0s; }
      .cb-t2 { animation-delay: -1.1s; }
      .cb-t3 { animation-delay: -2.2s; }
      .cb-t4 { animation-delay: -3.3s; }
      @keyframes cbTilePulse {
        0%, 100% { opacity: 0.42; }
        50% { opacity: 0.72; }
      }
      .cb-link { stroke-dasharray: 6 5; animation: cbLinkFlow 6s linear infinite; }
      .cb-l2 { animation-delay: -2s; }
      .cb-l3 { animation-delay: -4s; }
      @keyframes cbLinkFlow { to { stroke-dashoffset: -44; } }
    </style>
  </defs>

  <!-- Left mosaic -->
  <g>
    <rect class="cb-tile cb-t1" x="24" y="72" width="104" height="76" rx="6" fill="#EDE9FE" stroke="#DDD6FE" stroke-width="1.2"/>
    <rect class="cb-tile cb-t2" x="24" y="160" width="72" height="56" rx="6" fill="#F5F3FF" stroke="#E9D5FF" stroke-width="1.2"/>
    <rect class="cb-tile cb-t3" x="104" y="160" width="88" height="88" rx="6" fill="#FCE7F3" stroke="#FBCFE8" stroke-width="1.2"/>
    <rect class="cb-tile cb-t4" x="24" y="228" width="120" height="64" rx="6" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1.2"/>
    <rect class="cb-tile cb-t2" x="152" y="72" width="64" height="72" rx="6" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1.2"/>
    <rect class="cb-tile cb-t1" x="152" y="260" width="72" height="52" rx="6" fill="#F3E8FF" stroke="#E9D5FF" stroke-width="1.2"/>

    <path class="cb-link" d="M128 110 L148 198 L76 188" fill="none" stroke="#C4B5FD" stroke-width="1.2" opacity="0.55"/>
    <path class="cb-link cb-l2" d="M128 110 L184 118 L188 198" fill="none" stroke="#A78BFA" stroke-width="1" opacity="0.45"/>
    <path class="cb-link cb-l3" d="M76 188 L84 260 L188 286" fill="none" stroke="#F0ABFC" stroke-width="1" opacity="0.4"/>
    <line class="cb-link" x1="128" y1="110" x2="184" y2="198" stroke="#DDD6FE" stroke-width="1" opacity="0.35"/>
  </g>

  <!-- Right mosaic (mirrored) -->
  <g transform="translate(1200,0) scale(-1,1)">
    <rect class="cb-tile cb-t3" x="24" y="68" width="112" height="80" rx="6" fill="#EDE9FE" stroke="#DDD6FE" stroke-width="1.2"/>
    <rect class="cb-tile cb-t1" x="24" y="160" width="80" height="60" rx="6" fill="#FDF4FF" stroke="#E9D5FF" stroke-width="1.2"/>
    <rect class="cb-tile cb-t4" x="112" y="156" width="92" height="92" rx="6" fill="#FFF7ED" stroke="#FDE68A" stroke-width="1.2" opacity="0.85"/>
    <rect class="cb-tile cb-t2" x="24" y="232" width="128" height="68" rx="6" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.2"/>
    <rect class="cb-tile cb-t1" x="160" y="76" width="68" height="68" rx="6" fill="#FCE7F3" stroke="#FBCFE8" stroke-width="1.2"/>

    <path class="cb-link cb-l2" d="M136 108 L160 200 L92 190" fill="none" stroke="#C4B5FD" stroke-width="1.2" opacity="0.5"/>
    <path class="cb-link" d="M136 108 L196 120 L200 200" fill="none" stroke="#A78BFA" stroke-width="1" opacity="0.42"/>
    <path class="cb-link cb-l3" d="M92 190 L100 266 L204 292" fill="none" stroke="#E9D5FF" stroke-width="1" opacity="0.38"/>
  </g>
</svg>
