<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="Voice AI agent with phone">
  <defs>
    <linearGradient id="pBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A5F9E"/>
      <stop offset="100%" stop-color="#4A90E2"/>
    </linearGradient>
    <linearGradient id="pGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD5B4"/>
      <stop offset="50%" stop-color="#C9C4F8"/>
      <stop offset="100%" stop-color="#8FB9F4"/>
    </linearGradient>
    <filter id="pShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4A90E2" flood-opacity="0.25"/>
    </filter>
    <style>
      .p-float { animation: pFloat 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
      .p-eye { animation: pBlink 4.5s ease-in-out infinite; }
      @keyframes pBlink { 0%,42%,46%,100%{transform:scaleY(1)} 44%{transform:scaleY(0.1)} }
      .p-ring { animation: pRing 8s linear infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pRing { to{transform:rotate(360deg)} }
      .p-pulse { animation: pPulse 2s ease-in-out infinite; }
      @keyframes pPulse { 0%,100%{opacity:.45} 50%{opacity:1} }
      .p-wave { animation: pWave 1.4s ease-in-out infinite; }
      .p-wave2 { animation: pWave 1.4s ease-in-out infinite .35s; }
      .p-wave3 { animation: pWave 1.4s ease-in-out infinite .7s; }
      @keyframes pWave { 0%,100%{opacity:.25;transform:scale(.9)} 50%{opacity:.95;transform:scale(1.05)} }
      .p-phone { animation: pPhoneTilt 3s ease-in-out infinite; transform-box: fill-box; transform-origin: 218px 210px; }
      @keyframes pPhoneTilt { 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(6deg)} }
    </style>
  </defs>

  <ellipse cx="150" cy="318" rx="78" ry="12" fill="#4A90E2" opacity="0.14" class="p-pulse"/>

  <g class="p-float" filter="url(#pShadow)">
    <circle class="p-ring" cx="150" cy="140" r="112" fill="none" stroke="url(#pGlow)" stroke-width="2" stroke-dasharray="8 10" opacity="0.4"/>

    <rect x="78" y="78" width="144" height="124" rx="28" fill="url(#pBody)"/>
    <rect x="96" y="100" width="46" height="38" rx="10" fill="#0F2744" opacity="0.35"/>
    <rect x="158" y="100" width="46" height="38" rx="10" fill="#0F2744" opacity="0.35"/>
    <g class="p-eye" transform="translate(119,118)">
      <circle cx="0" cy="0" r="10" fill="#E0F2FE"/>
      <circle cx="2" cy="0" r="5" fill="#1E3A5F"/>
    </g>
    <g class="p-eye" transform="translate(181,118)">
      <circle cx="0" cy="0" r="10" fill="#E0F2FE"/>
      <circle cx="2" cy="0" r="5" fill="#1E3A5F"/>
    </g>
    <path d="M128 156 Q150 172 172 156" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.75"/>

    <rect x="106" y="202" width="88" height="76" rx="18" fill="url(#pBody)"/>
    <circle cx="150" cy="240" r="16" fill="white" opacity="0.14"/>

    <rect x="48" y="210" width="26" height="54" rx="12" fill="#3A7BC8"/>
    <rect x="118" y="278" width="30" height="38" rx="10" fill="#2A5F9E"/>
    <rect x="154" y="278" width="30" height="38" rx="10" fill="#2A5F9E"/>

    <rect x="126" y="50" width="48" height="22" rx="8" fill="#8FB9F4"/>
    <circle cx="150" cy="42" r="8" fill="#14B8A6" class="p-pulse"/>

    <!-- Right arm + phone -->
    <g class="p-phone">
      <rect x="218" y="198" width="28" height="58" rx="12" fill="#3A7BC8" transform="rotate(18 232 227)"/>
      <rect x="238" y="168" width="44" height="72" rx="12" fill="#1E293B" stroke="#14B8A6" stroke-width="2"/>
      <rect x="244" y="176" width="32" height="48" rx="6" fill="#0F766E" opacity="0.35"/>
      <circle cx="260" cy="232" r="5" fill="#14B8A6"/>
      <path class="p-wave" d="M286 188c8 6 12 14 12 22s-4 16-12 22" fill="none" stroke="#14B8A6" stroke-width="2.5" stroke-linecap="round"/>
      <path class="p-wave2" d="M294 180c12 10 18 22 18 34s-6 24-18 34" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <path class="p-wave3" d="M302 172c16 14 24 32 24 50s-8 36-24 50" fill="none" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    </g>
  </g>

  <g opacity="0.95">
    <rect x="20" y="22" width="96" height="34" rx="17" fill="white" stroke="#E2E8F0"/>
    <circle cx="38" cy="39" r="5" fill="#34D399" class="p-pulse"/>
    <text x="50" y="43" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#059669">ON CALL</text>
    <rect x="184" y="22" width="96" height="34" rx="17" fill="white" stroke="#E2E8F0"/>
    <text x="232" y="43" text-anchor="middle" font-family="Space Grotesk,Arial,sans-serif" font-size="11" font-weight="800" fill="#2A5F9E">Voice AI</text>
  </g>
</svg>
